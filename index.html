<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="燃">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>燃</title>
<style>
:root{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --sep:rgba(84,84,88,.6);
  --txt:#fff; --dim:#8e8e93; --dim2:#636366;
  --acc:#c22c2c; --acc2:#9c1f1f; --ok:#30d158; --warn:#ff9f0a;
  --r:14px; --tabh:50px; --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.4;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}

#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:calc(env(safe-area-inset-top) + 4px) 16px 4px;min-height:44px;
  background:rgba(0,0,0,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.brand{display:flex;align-items:center;gap:8px}
.brand img{height:26px;width:auto;display:block}
.brand b{color:var(--acc)}
.brand span{font-size:9px;letter-spacing:2.5px;color:var(--dim);font-weight:600}

#main{padding:0 0 calc(var(--tabh) + var(--safe-b) + 28px);max-width:600px;margin:0 auto;
  min-height:100vh;min-height:100dvh}
.pt{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.8px;margin:16px 16px 3px}
.psub{font-size:15px;color:var(--dim);margin:0 16px 20px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 16px 14px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:600;letter-spacing:-.2px}
.dim{color:var(--dim);font-size:15px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  color:var(--dim);padding:36px 16px;font-size:15px}
.empty svg{width:38px;height:38px;fill:none;stroke:var(--dim2);stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:0 18px;border-radius:12px;background:var(--card2);font-size:17px;font-weight:600;
  color:var(--txt);transition:opacity .15s,transform .15s}
.btn:active{opacity:.55;transform:scale(.985)}
.btn.primary{background:var(--acc);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:32px;padding:0 14px;font-size:15px;border-radius:16px;font-weight:600}
.btn.sm.warm-on{background:rgba(194,44,44,.2);color:#ff9a9a}

/* 方形入口卡 */
.sq{flex:1;aspect-ratio:1;background:var(--card);border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px}
.sq b{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sq span{font-size:12px;color:var(--dim);line-height:1.35}
.sq:active{background:var(--card2)}

/* 热量日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calh{font-size:11px;color:var(--dim);text-align:center;padding-bottom:2px}
.cald{border-radius:8px;background:var(--card2);min-height:44px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--dim)}
.cald b{font-size:12px;font-weight:600;color:#fff}
.cald span{font-size:9px;line-height:1}
.calg{background:rgba(48,209,88,.13)} .calg span{color:#6fdc8c}
.calr{background:rgba(255,69,58,.13)} .calr span{color:#ff8b84}
.caltoday{box-shadow:inset 0 0 0 1.5px var(--acc)}
.calfuture{opacity:.32}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.danger{background:transparent;color:#ff453a}

.chip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:20px;font-size:12px;
  background:rgba(120,120,128,.22);color:#d6d6da;font-weight:600;white-space:nowrap;letter-spacing:.2px}
.chip.kcal{background:rgba(120,120,128,.18);color:#c9c9ce}
.seg{min-height:36px;padding:0 18px;border-radius:10px;background:var(--card2);
  font-size:15px;color:var(--dim);font-weight:600}
.seg.on{background:var(--acc);color:#fff}
.hint{font-size:13px;color:var(--dim);padding:0 14px 10px;line-height:1.45}
.mbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mbar .ml{width:46px;font-size:15px;color:var(--dim);flex:none}
.mbar .mt{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.mbar .mt i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.mbar .mn{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;flex:none;text-align:right}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin:14px 0 10px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .3s}
.bar.over i{background:var(--warn)}
.big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-1px}
.big small{font-size:15px;color:var(--dim);font-weight:500;margin-left:6px;letter-spacing:0}
.search{width:100%;height:40px;padding:0 12px;border-radius:10px;border:none;
  background:var(--card2);color:var(--txt);font-size:17px;margin:4px 0 12px}
.search:focus{outline:none;box-shadow:0 0 0 2px rgba(194,44,44,.5)}
.search::placeholder{color:var(--dim2)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;height:34px;padding:0 14px;border-radius:17px;font-size:15px;
  background:var(--card2);color:var(--dim);font-weight:600}
.cats button.on{background:var(--acc);color:#fff}
.mbar .mt i.pf{background:var(--acc)}
.mbar .mt i.cf{background:rgba(194,44,44,.7)}
.mbar .mt i.ff{background:rgba(194,44,44,.42)}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:13px;color:var(--dim);margin:0 0 6px 2px}
select.search{appearance:none;-webkit-appearance:none}

/* 动作条目 */
.entry{background:var(--card2);border-radius:12px;margin:0 16px 12px;overflow:hidden}
.entry .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.entry .hd b{font-size:17px;font-weight:600}
.sets{padding:0 14px 4px}
.set{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;
  border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.set:first-child{border-top:none}
.card > .set:last-child{border-bottom:none}
.set .idx{color:var(--dim);font-size:15px;width:52px;flex:none}
.set .val{flex:1;font-size:17px;font-weight:500}
.set .val i{font-style:normal;color:var(--dim);font-weight:400;font-size:13px;margin-left:3px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:16px;
  color:var(--dim);font-size:15px;flex:none}
.iconbtn:active{background:rgba(255,255,255,.08)}

/* 记录一组 */
.addset{display:flex;align-items:center;gap:8px;padding:10px 14px 14px;border-top:.5px solid var(--sep);flex-wrap:wrap}
.stepper{display:flex;align-items:center;background:rgba(120,120,128,.2);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:20px;color:var(--acc);font-weight:600}
.stepper button:active{background:rgba(255,255,255,.08)}
.stepper .num{min-width:64px;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.numin{width:58px;background:rgba(120,120,128,.22);border:0;border-radius:8px;color:#fff;font:inherit;font-size:19px;font-weight:700;text-align:center;padding:3px 0;outline:none;-webkit-appearance:none;appearance:none}
.stepper .unit{font-size:10px;color:var(--dim);display:block;font-weight:500;line-height:1}
.addset .lbl{font-size:13px;color:var(--dim);width:100%;margin-bottom:2px}
.addset.cardio .stepper button{width:32px}
.addset.cardio .stepper .num{min-width:52px;font-size:16px}

/* 计时条 */
#timer{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe-b) + 10px);
  display:none;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;
  background:rgba(44,44,46,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-radius:16px;border:.5px solid var(--sep);z-index:18;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#timer.on{display:flex}
#timer .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:#ff6961;letter-spacing:.5px}
#timer .t small{font-size:11px;color:var(--dim);font-weight:500;display:block;letter-spacing:0}

/* 底部导航 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:19;display:flex;
  padding-bottom:var(--safe-b);background:rgba(28,28,30,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep)}
#tabs button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:10px;color:var(--dim);font-weight:500}
#tabs button.on{color:var(--acc)}
.ti{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* 选择动作 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#mask.on{display:block}

#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;
  background:var(--card);border-radius:20px 20px 0 0;padding:26px 16px calc(20px + var(--safe-b));
  -webkit-overflow-scrolling:touch}
#sheet.full{top:0;bottom:0;max-height:100%;border-radius:0;
  padding-top:calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom:calc(12px + var(--safe-b))}
#sheet.full::before{display:none}
#sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:36px;height:5px;border-radius:3px;background:#48484a}
.grp{font-size:12px;color:var(--dim);padding:16px 2px 6px;font-weight:600;letter-spacing:.4px;text-transform:none}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;
  border-top:.5px solid var(--sep);font-size:17px}
.pick:active{background:rgba(255,255,255,.06)}

/* 设置菜单行（左侧彩色图标砖） */
.mrow{display:flex;align-items:center;gap:13px;padding:11px 2px;border-top:.5px solid var(--sep)}
.card > .mrow:first-child{border-top:none}
.mi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:rgba(120,120,128,.22)}
.mi svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mr-txt{flex:1;min-width:0}
.mr-txt b{display:block;font-size:17px;font-weight:500;letter-spacing:-.2px}
.mr-txt span{display:block;font-size:13px;color:var(--dim);margin-top:2px}

.si{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 卡片标题带图标 */
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ch svg{width:17px;height:17px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ch h3{margin:0;font-size:17px;font-weight:600}
.card > .pick:first-child{border-top:none}
.card > .grp:first-child{padding-top:2px}

/* 输入 */
input.num{width:76px;height:36px;padding:0 8px;border-radius:8px;border:none;
  background:rgba(120,120,128,.2);color:var(--txt);text-align:center;font-weight:600;
  font-variant-numeric:tabular-nums;font-size:17px}
input.num:focus{outline:none;box-shadow:0 0 0 2px rgba(194,44,44,.5)}
.switch{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);
  position:relative;transition:.2s;flex:none}
.switch.on{background:var(--acc)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.2s}
.switch.on::after{left:22px}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 18px);
  transform:translateX(-50%) translateY(10px);background:rgba(44,44,46,.96);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;pointer-events:none;
  transition:.2s;z-index:50;white-space:nowrap;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 长按确认按钮 */
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:none}
.hold .hold-fill{position:absolute;left:0;top:0;bottom:0;width:0;pointer-events:none;
  background:rgba(255,255,255,.3)}
.hold .hold-txt{position:relative;z-index:1}
.hold.holding{opacity:1;transform:none}

/* 训练完成庆祝 */
#celebrate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#celebrate.on{display:flex}
#celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;z-index:1;width:calc(100% - 52px);max-width:330px;text-align:center;
  animation:celIn .55s cubic-bezier(.2,.9,.3,1.35)}
@keyframes celIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.cel-ring{width:92px;height:92px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#e33b3b,#7d1414 70%);
  animation:pulse 1.5s ease-out .25s 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,44,44,.6)}100%{box-shadow:0 0 0 36px rgba(194,44,44,0)}}
.cel-ring svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;animation:draw .5s ease-out .35s both}
@keyframes draw{from{stroke-dasharray:40;stroke-dashoffset:40}to{stroke-dasharray:40;stroke-dashoffset:0}}
.cel-title{font-size:25px;font-weight:800;letter-spacing:1px}
.cel-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:16px 22px;margin:20px 0 4px}
.cel-stats b{display:block;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.cel-stats span{font-size:11px;color:var(--dim);letter-spacing:.5px}
.cel-quote{font-size:15px;color:#ffb0b0;margin:18px 0 26px;line-height:1.55;min-height:44px}

/* 小彩蛋 */
#egg{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#egg.on{display:flex}
.egg-card{width:calc(100% - 64px);max-width:310px;background:var(--card);border-radius:20px;
  padding:26px 22px;text-align:center;animation:celIn .45s cubic-bezier(.2,.9,.3,1.3)}
.egg-card b{display:block;font-size:16px;margin-bottom:12px;color:#ff8f8f;letter-spacing:.5px}
.egg-card p{margin:0;font-size:16px;line-height:1.6;color:#fff}

/* ========== 启动动画（图片 base64 内联，保证首帧立刻可见） ========== */
#splash{position:fixed;inset:0;z-index:9999;background:#000;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s ease;will-change:opacity}
#splash.out{opacity:0;pointer-events:none}
#splash.gone{display:none}
.sp-mark{position:relative;width:min(40vw,170px);aspect-ratio:758/512}
.sp-glow{position:absolute;inset:-16%;opacity:0;transform:scale(.6);transform-origin:72% 36%;
  background:radial-gradient(38% 36% at 72% 36%,rgba(222,48,40,.95) 0%,rgba(198,38,32,.42) 46%,rgba(150,18,14,0) 74%);
  filter:blur(16px);
  animation:spGlowIn .5s .48s ease-out forwards,spGlowB 2.4s .98s ease-in-out infinite}
.sp-glyph{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.965);
  filter:blur(7px) brightness(.75);
  animation:spGlyph .62s .06s cubic-bezier(.2,.8,.25,1) forwards}
.sp-fw{position:absolute;inset:0}
.sp-fb,.sp-ft{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform-origin:46% 52%;will-change:transform,filter}
.sp-fb{animation:spFlameIn .24s .48s ease-out forwards,spFb 2.2s .98s ease-in-out infinite}
.sp-ft{animation:spFlameIn .24s .50s ease-out forwards,spFt 1.55s 1s ease-in-out infinite}
.sp-ember{position:absolute;width:3px;height:3px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,#ff6a5e 0%,#e0322a 55%,rgba(224,50,42,0) 100%);filter:blur(.4px)}
.sp-e1{left:44%;top:52%;animation:spRise 1.6s .95s ease-out infinite}
.sp-e2{left:56%;top:46%;animation:spRise 2.1s 1.3s ease-out infinite}
.sp-e3{left:63%;top:38%;animation:spRise 1.8s 1.05s ease-out infinite}
.sp-e4{left:49%;top:55%;animation:spRise 2.4s 1.6s ease-out infinite}
.sp-e5{left:59%;top:42%;animation:spRise 1.5s 2.0s ease-out infinite}
@keyframes spGlyph{from{opacity:0;transform:scale(.965);filter:blur(7px) brightness(.75)}
  to{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}}
@keyframes spFlameIn{from{opacity:0;filter:brightness(2.3) saturate(1.4)}
  to{opacity:1;filter:brightness(1) saturate(1)}}
@keyframes spGlowIn{from{opacity:0;transform:scale(.6)}to{opacity:.62;transform:scale(1)}}
@keyframes spGlowB{0%,100%{opacity:.44;transform:scale(.97)}45%{opacity:.74;transform:scale(1.1)}
  70%{opacity:.52;transform:scale(1.02)}}
@keyframes spFt{0%{transform:scaleY(1) scaleX(1) rotate(0deg);filter:brightness(1) saturate(1)}
  22%{transform:scaleY(1.075) scaleX(.985) rotate(-.8deg);filter:brightness(1.12) saturate(1.08)}
  46%{transform:scaleY(.975) scaleX(1.012) rotate(.5deg);filter:brightness(.95) saturate(.98)}
  68%{transform:scaleY(1.05) scaleX(.992) rotate(-.45deg);filter:brightness(1.08) saturate(1.05)}
  88%{transform:scaleY(.99) scaleX(1.004) rotate(.15deg);filter:brightness(.99) saturate(1)}
  100%{transform:scaleY(1) scaleX(1) rotate(0deg);filter:brightness(1) saturate(1)}}
@keyframes spFb{0%,100%{transform:scaleY(1) scaleX(1);filter:brightness(1)}
  30%{transform:scaleY(1.02) scaleX(1.006);filter:brightness(1.07)}
  62%{transform:scaleY(.988) scaleX(.996);filter:brightness(.97)}}
@keyframes spRise{0%{opacity:0;transform:translate(0,0) scale(.6)}14%{opacity:.95}
  60%{opacity:.45}100%{opacity:0;transform:translate(-7px,-46px) scale(.25)}}
@media (prefers-reduced-motion:reduce){
  #splash .sp-glyph,#splash .sp-fb,#splash .sp-ft{opacity:1!important;filter:none!important;transform:none!important;animation:none!important}
  #splash .sp-glow{opacity:.5!important;transform:none!important;animation:none!important}
  #splash .sp-ember{display:none}
}
</style>
</head>
<body>
<div id="splash">

      setWake(true);
    }
  }
});
window.addEventListener("pageshow", function(){ if (rest.endAt) tickRest(); });
window.addEventListener("focus", function(){ if (rest.endAt) tickRest(); });

/* ===== 个人纪录 ===== */
function prList(){
  var map = {}, i, j;
  for (i=0;i<db.workouts.length;i++){
    var w = db.workouts[i];
    for (j=0;j<w.entries.length;j++){
      var e = w.entries[j];
      if (!e.sets || !e.sets.length) continue;
      if (e.type === "assist" || e.bw) continue;   /* 辅助动作的「重量」不是负荷，不参与 1RM 排名 */
      var key = e.exId || e.name;
      var e1 = best1rm(e.sets);
      var top = e.sets[0];
      for (var s=1;s<e.sets.length;s++) if (e.sets[s].w > top.w) top = e.sets[s];
      if (!map[key] || e1 > map[key].e1){
        map[key] = { name:e.name, e1:e1, w:top.w, r:top.r, date:w.date };
      }
    }
  }
  var arr = [];
  for (var k in map) if (map.hasOwnProperty(k)) arr.push(map[k]);
  arr.sort(function(a,b){ return b.e1 - a.e1; });
  return arr;
}

/* ===== 宏量营养素 ===== */
function macroTargets(){
  var w = bodyWeight(), kcal = targetKcal();
  if (!w) return null;
  var p = Math.round(w * 1.6);
  var f = Math.round(w * 0.8);
  var c = Math.max(0, Math.round((kcal - p*4 - f*9) / 4));
  return { p:p, c:c, f:f };
}
function macroSums(meals){
  var p = 0, c = 0, f = 0;
  for (var i=0;i<meals.length;i++){
    var m = meals[i];
    p += (Number(m.p) || 0) * m.amount;
    c += (Number(m.c) || 0) * m.amount;
    f += (Number(m.f) || 0) * m.amount;
  }
  return { p:Math.round(p), c:Math.round(c), f:Math.round(f) };
}

/* ========== 渲染 ========== */
function render(){
  paintTimer();
  if (wakeWanted !== !!db.active) setWake(!!db.active);
  var main = document.getElementById("main");
  var hdrR = document.getElementById("hdrRight");
  hdrR.innerHTML = "";
  var tabs = document.querySelectorAll("#tabs button");
  for (var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle("on", tabs[i].getAttribute("data-tab") === ui.tab);
  }
  if (ui.tab === "train") main.innerHTML = viewTrain();
  else if (ui.tab === "hist") main.innerHTML = viewHist();
  else if (ui.tab === "food") main.innerHTML = viewFood();
  else main.innerHTML = viewSet();

  /* 训练进行中时，任何页面顶部都能结束，不用切回训练页 */
  if (db.active){
    hdrR.innerHTML = '<button class="btn sm hold" data-hold="1" data-hold-label="结束训练" ' +
      'style="color:var(--acc)"><span class="hold-fill"></span>' +
      '<span class="hold-txt">结束训练</span></button>';
  }
  paintSheet();
  save();
}

/* ===== 页面骨架 ===== */
function pageHead(title, sub){
  return '<h1 class="pt">' + title + '</h1>' +
    (sub ? '<div class="psub">' + sub + '</div>' : '<div style="height:14px"></div>');
}
function emptyState(icon, title, sub, act, label){
  return '<div class="empty">' +
    '<svg><use href="#' + icon + '"></use></svg>' +
    '<div style="color:var(--txt);font-weight:600;font-size:17px">' + title + '</div>' +
    (sub ? '<div>' + sub + '</div>' : '') +
    (act ? '<button class="btn primary" data-act="' + act + '" style="margin-top:10px">' + label + '</button>' : '') +
    '</div>';
}
function weekSummary(){
  var now = new Date(), mon = new Date(now);
  mon.setHours(0,0,0,0);
  mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  var count = 0, vol = 0, kcal = 0;
  for (var i=0;i<db.workouts.length;i++){
    var w = db.workouts[i];
    if (new Date(w.date + "T12:00:00") < mon) continue;
    count++;
    vol += volume(w);
    kcal += workoutKcal(w);
  }
  return { count:count, volume:Math.round(vol), kcal:Math.round(kcal) };
}

function viewTrain(){
  if (!db.active){
    var n = db.workouts.length;
    var last = n ? db.workouts[n-1] : null;
    var wk = weekSummary();
    var s = pageHead("训练", "今天 · " + today());
    s += '<div class="card" style="padding:18px 16px">' +
      '<button class="btn primary block" data-act="wo:start" style="height:52px">开始训练</button>' +
      (last ? '<button class="btn block" data-act="wo:copy" style="margin-top:12px">照上次练</button>' : '') +
      '</div>';

    if (last){
      s += '<div class="card"><div class="spread" style="margin-bottom:10px">' +
        '<div class="ch" style="margin:0"><svg><use href="#i-timer"></use></svg><h3>上次训练</h3></div>' +
        '<span class="dim" style="font-size:13px">' + last.date + '</span></div>';
      var le = last.entries.slice(0, 4);
      for (var j=0;j<le.length;j++){
        s += '<div class="spread" style="padding:7px 0">' +
          '<span style="font-size:15px">' + esc(le[j].name) + '</span>' +
          '<span class="dim" style="font-size:14px;font-variant-numeric:tabular-nums">' +
          (le[j].kind === "cardio" ? ((le[j].dur || 0) + ' 分钟') : (le[j].sets.length + ' 组')) +
          '</span></div>';
      }
      if (last.entries.length > 4) s += '<div class="dim" style="font-size:13px;padding-top:6px">+ 还有 ' + (last.entries.length - 4) + ' 个动作</div>';
      s += '</div>';
    } else {
      s += '<div class="card">' + emptyState("i-train", "还没有训练记录", "点上面的按钮开始第一次", null, null) + '</div>';
    }

    if (n){
      s += '<div class="card"><div class="spread" style="text-align:center">' +
        '<div style="flex:1"><div style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums">' + wk.count + '</div>' +
        '<div class="dim" style="font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px"><svg class="si"><use href="#i-hist"></use></svg>本周训练</div></div>' +
        '<div style="flex:1"><div style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums">' + wk.volume + '</div>' +
        '<div class="dim" style="font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px"><svg class="si"><use href="#i-chart"></use></svg>容量 kg</div></div>' +
        '<div style="flex:1"><div style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums">' + wk.kcal + '</div>' +
        '<div class="dim" style="font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px"><svg class="si"><use href="#i-flame"></use></svg>消耗 千卡</div></div>' +
        '</div></div>';
    }
    return s;
  }
  var a = db.active;
  var tk = workoutKcal(a);
  var s = pageHead("训练", "本次 · " + a.entries.length + " 个动作" + (tk ? " · ≈" + tk + " 千卡" : ""));
  s += '<div class="row" style="margin:0 16px 14px">' +
    '<button class="btn sm" data-act="rest:manual">开始休息</button>' +
    '<button class="btn sm ghost" data-act="wo:cancel">放弃</button></div>';

  if (!a.entries.length){
    s += '<div class="card">' + emptyState("i-plus", "还没有动作", "从动作库里选一个", "ex:open", "添加动作") + '</div>';
  }
  for (var i=0;i<a.entries.length;i++){
    s += entryCard("active", i, a.entries[i]);
  }
  s += '<div style="margin:0 16px"><button class="btn block" data-act="ex:open">+ 添加动作</button></div>';

  var totSets = 0, totMin = 0;
  for (var q=0;q<a.entries.length;q++){
    if (a.entries[q].kind === "cardio") totMin += Number(a.entries[q].dur) || 0;
    else totSets += (a.entries[q].sets || []).length;
  }
  var sumTxt = [];
  if (totSets) sumTxt.push(totSets + " 组");
  if (totMin) sumTxt.push("有氧 " + totMin + " 分钟");
  if (tk) sumTxt.push("≈" + tk + " 千卡");
  if (sumTxt.length){
    s += '<div class="dim" style="text-align:center;margin:16px 16px 0;font-size:14px">本次 ' +
      sumTxt.join(" · ") + '</div>';

    '<span class="hold-txt">长按结束训练</span></button></div>';
  return s;
}

function entryCard(where, ei, e){
  if (e.kind === "cardio") return cardioCard(where, ei, e);
  if (e.bw) return bwCard(where, ei, e);
  var unit = unitOf(e.type), lab = labelOf(e.type);
  var step = (e.type === "assist") ? 5 : (Number(db.settings.step) || 2.5);
  var ls = lastSets(e.exId);
  var le = lastEntryOf(e.exId);
  var sug = suggestOf(e.exId, step, e.type === "assist");

  var pw = 20, pr = 10;
  if (e.sets.length){ pw = e.sets[e.sets.length-1].w; pr = e.sets[e.sets.length-1].r; }
  else if (sug.w !== null){ pw = sug.w; pr = sug.r; }
  else if (ls && ls.length){ pw = ls[ls.length-1].w; pr = ls[ls.length-1].r; }

  var b1 = Math.max(best1rm(e.sets), le ? best1rm(le.sets) : 0);
  var kc = kcalOf(e);
  var s = '<div class="entry"><div class="hd"><b>' + esc(e.name) + '</b><span class="row" style="gap:6px">' +
    (e.type === "assist" ? '<span class="chip">辅助</span>' : '') +
    (kc ? '<span class="chip kcal">≈ ' + kc + ' 千卡</span>' : '') +
    (where === "active" ? '<button class="iconbtn" data-act="ex:remove" data-e="' + ei + '">✕</button>' : '') +
    '</span></div>' +
    '<div class="hint">' +
      (sug.w !== null ? '建议' + (e.type === "assist" ? "辅助 " : " ") + fmtW(sug.w) + 'kg · ' : '') +
      sug.txt + (b1 ? ' · 1RM≈' + Math.round(b1) + 'kg' : '') + '</div>' +
    '<div class="sets">';
  if (!e.sets.length){
    s += '<div class="dim" style="padding:4px 2px 8px">还没有记录，下面记第一组</div>';
  }
  for (var k=0;k<e.sets.length;k++){
    var st = e.sets[k];
    var editing = ui.edit && ui.edit.w === where && ui.edit.e === ei && ui.edit.s === k;
    if (editing){
      s += '<div class="set"><span class="idx">第' + (k+1) + '组</span>' +
        '<input class="num" data-in="w" type="number" inputmode="decimal" step="0.5" value="' + fmtW(st.w) + '">' +
        '<span class="dim">×</span>' +
        '<input class="num" data-in="r" type="number" inputmode="numeric" step="1" value="' + st.r + '">' +
        '<button class="iconbtn" data-act="set:save" data-w="' + where + '" data-e="' + ei + '" data-s="' + k + '">✓</button>' +
        '</div>';
    } else {
      s += '<div class="set"' + (st.warm ? ' style="opacity:.62"' : '') + '>' +
        '<span class="idx">' + (st.warm ? '热身' : '第' + (k+1) + '组') + '</span>' +
        '<span class="val">' + fmtW(st.w) + '<i>' + unit + '</i> × ' + st.r + '<i>次</i></span>' +
        '<button class="iconbtn" data-act="set:edit" data-w="' + where + '" data-e="' + ei + '" data-s="' + k + '">改</button>' +
        '<button class="iconbtn" data-act="set:del" data-w="' + where + '" data-e="' + ei + '" data-s="' + k + '">✕</button>' +
        '</div>';
    }
  }
  s += '</div>';
  if (where === "active"){
    s += '<div class="addset" data-ei="' + ei + '">' +
      '<span class="lbl">记录一组 · ' + lab + (ui.warm ? '（热身）' : '') + '</span>' +
      '<div class="stepper" data-step="' + step + '">' +
        '<button data-act="st:down" data-k="w">−</button>' +
        '<div class="num" data-v="w" data-act="num:edit" data-k="w">' + fmtW(pw) + '<span class="unit">' + unit + '</span></div>' +
        '<button data-act="st:up" data-k="w">+</button>' +
      '</div>' +
      '<div class="stepper" data-step="1">' +
        '<button data-act="st:down" data-k="r">−</button>' +
        '<div class="num" data-v="r" data-act="num:edit" data-k="r">' + pr + '<span class="unit">次</span></div>' +
        '<button data-act="st:up" data-k="r">+</button>' +
      '</div>' +
      '<button class="btn sm ' + (ui.warm ? 'warm-on' : '') + '" data-act="warm:toggle"' +
        (ui.warm ? '' : ' style="background:rgba(120,120,128,.2)"') + '>热身</button>' +
      '<button class="btn sm primary" data-act="set:add" data-e="' + ei + '">记录</button>' +
      '</div>';
  }
  s += '</div>';
  return s;
}

/* 自重动作：只记次数 */
function bwCard(where, ei, e){
  var kc = kcalOf(e);
  var le = lastEntryOf(e.exId);
  var pr = 10, tot = 0, i;
  if (e.sets.length) pr = e.sets[e.sets.length-1].r;
  else if (le && le.sets && le.sets.length) pr = le.sets[le.sets.length-1].r;
  for (i=0;i<e.sets.length;i++) tot += e.sets[i].r;

  var s = '<div class="entry"><div class="hd"><b>' + esc(e.name) + '</b>' +
    '<span class="row" style="gap:6px"><span class="chip">自重</span>' +
    (kc ? '<span class="chip kcal">≈ ' + kc + ' 千卡</span>' : '') +
    (where === "active" ? '<button class="iconbtn" data-act="ex:remove" data-e="' + ei + '">✕</button>' : '') +
    '</span></div>' +
    '<div class="hint">' + (tot ? '共 ' + tot + ' 次' : '只记次数，不记重量') + '</div>' +
    '<div class="sets">';
  if (!e.sets.length) s += '<div class="dim" style="padding:4px 2px 8px">还没有记录，下面记第一组</div>';
  for (var k=0;k<e.sets.length;k++){
    var st = e.sets[k];
    s += '<div class="set"><span class="idx">第' + (k+1) + '组</span>' +
      '<span class="val">' + st.r + '<i>次</i></span>' +
      '<button class="iconbtn" data-act="bw:edit" data-w="' + where + '" data-e="' + ei + '" data-s="' + k + '">改</button>' +
      '<button class="iconbtn" data-act="set:del" data-w="' + where + '" data-e="' + ei + '" data-s="' + k + '">✕</button></div>';
  }
  s += '</div>';
  if (where === "active"){
    s += '<div class="addset" data-ei="' + ei + '">' +
      '<span class="lbl">记录一组 · 次数</span>' +
      '<div class="stepper" data-step="1">' +
        '<button data-act="st:down" data-k="r">−</button>' +
        '<div class="num" data-v="r" data-act="num:edit" data-k="r">' + pr + '<span class="unit">次</span></div>' +
        '<button data-act="st:up" data-k="r">+</button>' +
      '</div>' +
      '<button class="btn sm primary" data-act="bw:add" data-e="' + ei + '">记录</button>' +
      '</div>';
  }
  s += '</div>';
  return s;
}

/* 有氧动作卡片：记时长 + 距离 */
function cardioCard(where, ei, e){
  var kc = kcalOf(e);
  var last = lastEntryOf(e.exId);
  var du = e.dur || (last && last.dur) || 30;
  var km = (e.km !== undefined && e.km !== null) ? e.km : ((last && last.km) || 0);
  var gr = (e.grade !== undefined && e.grade !== null) ? e.grade : ((last && last.grade) || 0);
  var hint;
  if (e.dur){
    hint = e.dur + ' 分钟' + (e.km ? ' · ' + fmtW(e.km) + ' km' : '') +
      (gr ? ' · 坡度 ' + gr + '%' : '') + (kc ? ' · 约 ' + kc + ' 千卡' : '');
  } else if (last && last.dur){
    hint = '上次 ' + last.dur + ' 分钟' + (last.km ? ' · ' + fmtW(last.km) + ' km' : '') +
      (last.grade ? ' · 坡度 ' + last.grade + '%' : '') + ' · 填完自动算消耗';
  } else {
    hint = '填时长后自动估算消耗';
  }
  var s = '<div class="entry"><div class="hd"><b>' + esc(e.name) + '</b>' +
    '<span class="row" style="gap:6px"><span class="chip">有氧</span>' +
    (kc ? '<span class="chip kcal">≈ ' + kc + ' 千卡</span>' : '') +
    (where === "active" ? '<button class="iconbtn" data-act="ex:remove" data-e="' + ei + '">✕</button>' : '') +
    '</span></div>' +
    '<div class="hint">' + hint + '</div>';
  if (where === "active"){
    s += '<div class="addset cardio" data-ei="' + ei + '">' +
      '<span class="lbl">时长 / 距离</span>' +
      '<div class="stepper" data-step="5">' +
        '<button data-act="st:down" data-k="d">−</button>' +
        '<div class="num" data-v="d" data-act="num:edit" data-k="d">' + du + '<span class="unit">分钟</span></div>' +
        '<button data-act="st:up" data-k="d">+</button></div>' +
      '<div class="stepper" data-step="0.5">' +
        '<button data-act="st:down" data-k="k">−</button>' +
        '<div class="num" data-v="k" data-act="num:edit" data-k="k">' + fmtW(km) + '<span class="unit">km</span></div>' +
        '<button data-act="st:up" data-k="k">+</button></div>' +
      (e.inc ? '<div class="stepper" data-step="1">' +
        '<button data-act="st:down" data-k="g">−</button>' +
        '<div class="num" data-v="g" data-act="num:edit" data-k="g">' + gr + '<span class="unit">坡度%</span></div>' +
        '<button data-act="st:up" data-k="g">+</button></div>' : '') +
      '<button class="btn sm primary" data-act="cardio:set" data-e="' + ei + '">' +
      (e.dur ? "更新" : "记录") + '</button>' +
      (e.dur ? '<button class="iconbtn" data-act="cardio:del" data-e="' + ei + '">✕</button>' : '') +
      '</div>';
  }
  s += '</div>';
  return s;
}

function countSets(w){
  var t = 0;
  for (var i=0;i<w.entries.length;i++) t += (w.entries[i].sets || []).length;
  return t;
}
function countCardioMin(w){
  var t = 0;
  for (var i=0;i<w.entries.length;i++){
    if (w.entries[i].kind === "cardio") t += Number(w.entries[i].dur) || 0;
  }
  return t;
}
function volume(w){
  var v = 0;
  for (var i=0;i<w.entries.length;i++){
    if (w.entries[i].type === "assist") continue;   /* 辅助重量不是负荷，不参与容量 */
    for (var k=0;k<w.entries[i].sets.length;k++){ if (w.entries[i].sets[k].warm) continue; v += w.entries[i].sets[k].w * w.entries[i].sets[k].r; }
  }
  return Math.round(v);
}

function prPage(){
  var prs = prList();
  if (!prs.length) return '<div class="card"><div class="empty">还没有纪录<br>记录几次训练就有了</div></div>';
  var s = '<div class="card">';
  var lim = Math.min(prs.length, 20);
  for (var pi=0;pi<lim;pi++){
    var pr = prs[pi];
    s += '<div class="spread" style="padding:11px 0;border-bottom:.5px solid var(--sep)">' +
      '<span style="font-size:15px">' + esc(pr.name) + '</span>' +
      '<span style="font-size:14px;color:#ffb340;font-variant-numeric:tabular-nums">1RM ' +
      Math.round(pr.e1) + 'kg<span class="dim" style="margin-left:8px">' +
      fmtW(pr.w) + '×' + pr.r + '</span></span></div>';
  }
  s += '<div class="dim" style="font-size:12px;margin-top:10px">1RM 按 Epley 公式估算，取该动作历史最好成绩' +
    (prs.length > 20 ? '，只显示前 20 个' : '') + '。辅助与自重动作不参与排名。</div></div>';
  return s;
}
function volumePage(){
  var st = weekStats();
  if (!st.total) return '<div class="card"><div class="empty">本周还没有训练记录</div></div>';
  var order = GROUPS_ALL, mx = 1, s = '<div class="card">';
  for (var q=0;q<order.length;q++){ if ((st.map[order[q]] || 0) > mx) mx = st.map[order[q]]; }
  for (var q2=0;q2<order.length;q2++){
    var gg = order[q2], nn = st.map[gg] || 0;
    if (!nn) continue;
    s += '<div class="mbar"><span class="ml">' + gg + '</span>' +
      '<span class="mt"><i style="width:' + Math.round(nn/mx*100) + '%"></i></span>' +
      '<span class="mn">' + nn + '</span></div>';
  }
  s += '<div class="dim" style="font-size:12px;margin-top:8px">单位：组。每个部位每周 10–20 组是常见参考，仅供参考。</div></div>';
  return s;
}

function viewHist(){
  if (ui.histPage === "pr") return subHead("个人纪录", "hist:back", "记录") + prPage();
  if (ui.histPage === "volume") return subHead("本周肌群容量", "hist:back", "记录") + volumePage();
  var ws = db.workouts.slice().reverse();
  var wk = weekSummary();
  var s = pageHead("记录", ws.length ? "共 " + ws.length + " 次训练" : null);
  if (!ws.length){
    return s + '<div class="card"><div class="empty">' +
      '<svg><use href="#i-hist"></use></svg>' +

      s += '<div style="margin-top:12px">';
      for (var k=0;k<w.entries.length;k++){
        var kc2 = kcalOf(w.entries[k]);
        var en = w.entries[k];
        s += '<div style="margin-bottom:12px"><div style="font-size:15px;font-weight:600;margin-bottom:4px">' +
          esc(en.name) +

          (en.type === "assist" ? ' <span class="chip">辅助</span>' : '') +
          (kc2 ? ' <span class="chip kcal">≈ ' + kc2 + ' 千卡</span>' : '') + '</div>';
        if (en.kind === "cardio"){
          s += '<div class="set" style="border-top:none"><span class="val">' +
            (en.dur || 0) + '<i>分钟</i>' + (en.km ? ' · ' + fmtW(en.km) + '<i>km</i>' : '') +
            (en.grade ? ' · 坡度 ' + en.grade + '<i>%</i>' : '') +
            '</span></div></div>';
          continue;
        }
        var sets = en.sets;
        for (var p=0;p<sets.length;p++){
          var editing = ui.edit && ui.edit.w === idx && ui.edit.e === k && ui.edit.s === p;
          if (editing){
            s += '<div class="set"><span class="idx">第' + (p+1) + '组</span>' +
              '<input class="num" data-in="w" type="number" inputmode="decimal" step="0.5" value="' + fmtW(sets[p].w) + '">' +
              '<span class="dim">×</span>' +
              '<input class="num" data-in="r" type="number" inputmode="numeric" step="1" value="' + sets[p].r + '">' +
              '<button class="iconbtn" data-act="set:save" data-w="' + idx + '" data-e="' + k + '" data-s="' + p + '">✓</button></div>';
          } else {
            var wu = sets[p].warm;
            s += '<div class="set"' + (wu ? ' style="opacity:.62"' : '') + '>' +
              '<span class="idx">' + (wu ? "热身" : "第" + (p + 1) + "组") + '</span>' +
              '<span class="val">' + (en.bw
                ? (sets[p].r + '<i>次</i>')
                : (fmtW(sets[p].w) + '<i>' + unitOf(en.type) + '</i> × ' + sets[p].r + '<i>次</i>')) + '</span>' +
              (en.bw ? '' : '<button class="iconbtn" data-act="set:edit" data-w="' + idx + '" data-e="' + k + '" data-s="' + p + '">改</button>') +
              '<button class="iconbtn" data-act="set:del" data-w="' + idx + '" data-e="' + k + '" data-s="' + p + '">✕</button></div>';
          }

        s += '</div>';

      s += '<div class="row" style="gap:10px;margin-top:12px;flex-wrap:wrap">' +
        '<button class="btn sm danger" data-act="hist:del" data-id="' + w.id + '">删除这次训练</button></div></div>';
    }
    s += '</div>';
  }
  return s;
}

/* ===== 饮食 ===== */
function targetKcal(){
  var t = Number(db.profile.target) || 0;
  if (t > 0) return Math.round(t);
  var b = bmrOf();
  return b ? Math.round(b * 1.5) : 0;
}
function todayMeals(){
  var d = today();
  return db.meals.filter(function(m){ return m.date === d; });
}
/* ===== 每日收支 / 日历 / 维生素 ===== */
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function dayStats(dateStr){
  var kcal = 0, vc = 0, va = 0, vd = 0, i;
  for (i=0;i<db.meals.length;i++){
    var m = db.meals[i];
    if (m.date !== dateStr) continue;
    kcal += Math.round((Number(m.per) || 0) * m.amount);
    vc += (Number(m.vc) || 0) * m.amount;
    va += (Number(m.va) || 0) * m.amount;
    vd += (Number(m.vd) || 0) * m.amount;
  }
  var burn = 0, cnt = 0;
  for (i=0;i<db.workouts.length;i++){
    if (db.workouts[i].date === dateStr){ burn += workoutKcal(db.workouts[i]); cnt++; }
  }
  return { intake: kcal, workout: burn, wcount: cnt, vc: vc, va: va, vd: vd };
}
function balanceOf(dateStr){
  var st = dayStats(dateStr);
  var base = Math.round(bmrOf() * 1.2);      /* 基础代谢 × 1.2 粗略活动量 */
  var total = base + st.workout;
  return { intake: st.intake, base: base, workout: st.workout, total: total, net: st.intake - total };
}
function balanceCard(){
  if (!bodyWeight()) return '<div class="card"><div class="ch"><svg><use href="#i-flame"></use></svg><h3>今日热量收支</h3></div><div class="dim">先在「设置 → 身体数据」里填体重，才能估算消耗。</div></div>';
  var b = balanceOf(today());
  var pct = b.total ? Math.min(100, Math.round(b.intake / b.total * 100)) : 0;
  var deficit = -b.net;
  var color = b.net <= 0 ? "#30d158" : "#ff453a";
  return '<div class="card"><div class="ch"><svg><use href="#i-flame"></use></svg><h3>今日热量收支</h3></div>' +
    '<div class="spread" style="margin-bottom:12px">' +
      '<div><div class="dim" style="font-size:12px">摄入</div><div style="font-size:22px;font-weight:700">' + b.intake + '</div></div>' +
      '<div style="text-align:right"><div class="dim" style="font-size:12px">消耗（估）</div><div style="font-size:22px;font-weight:700">' + b.total + '</div></div>' +
    '</div>' +
    '<div class="bar ' + (b.net > 0 ? "over" : "") + '"><i style="width:' + pct + '%"></i></div>' +
    '<div class="spread" style="margin-top:2px">' +
      '<span class="dim" style="font-size:12px">基础代谢 ' + b.base + ' + 训练 ' + b.workout + '</span>' +
      '<span style="font-weight:700;color:' + color + '">' + (b.net <= 0 ? "缺口 " + deficit : "盈余 " + b.net) + ' 千卡</span></div>' +
    '<div class="dim" style="font-size:12px;margin-top:10px">消耗 = 基础代谢×1.2 + 训练消耗，属估算，不含走路等零碎活动。</div>' +
    '</div>';
}
function calendarCard(){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var first = new Date(y, m, 1);
  var pad = (first.getDay() + 6) % 7;
  var days = new Date(y, m + 1, 0).getDate();
  var tstr = today();
  var s = '<div class="card"><div class="spread" style="margin-bottom:12px">' +
    '<div class="ch" style="margin:0"><svg><use href="#i-hist"></use></svg><h3>' + (m + 1) + ' 月</h3></div>' +
    '<span class="dim" style="font-size:12px">绿缺口 · 红盈余</span></div><div class="cal">';
  var wd = ["一","二","三","四","五","六","日"], i;
  for (i=0;i<7;i++) s += '<div class="calh">' + wd[i] + '</div>';
  for (i=0;i<pad;i++) s += '<div></div>';
  for (var d=1;d<=days;d++){
    var ds = y + "-" + pad2(m + 1) + "-" + pad2(d);
    var b = balanceOf(ds);
    var cls = "cald", txt = "";
    if (b.intake > 0 || b.workout > 0){
      cls += (b.net <= 0) ? " calg" : " calr";
      txt = (b.net > 0 ? "+" : "") + b.net;
    }
    if (ds === tstr) cls += " caltoday";
    if (ds > tstr) cls += " calfuture";
    s += '<div class="' + cls + '"><b>' + d + '</b><span>' + txt + '</span></div>';
  }
  return s + '</div></div>';
}
function nutrientCard(meals){

  if (mt){
    var mrows = [["蛋白质", ms.p, mt.p, "pf"], ["碳水", ms.c, mt.c, "cf"], ["脂肪", ms.f, mt.f, "ff"]];
    for (var i=0;i<mrows.length;i++){
      var r = mrows[i], p = r[2] ? Math.min(100, Math.round(r[1] / r[2] * 100)) : 0;
      s += '<div class="mbar"><span class="ml">' + r[0] + '</span>' +
        '<span class="mt"><i class="' + r[3] + '" style="width:' + p + '%"></i></span>' +
        '<span class="mn">' + r[1] + '/' + r[2] + '</span></div>';
    }
  }
  s += '<div style="height:1px;background:var(--sep);margin:12px 0"></div>';
  var vrows = [["维C", Math.round(st.vc), 100], ["维A", Math.round(st.va), 800], ["维D", Math.round(st.vd * 10) / 10, 10]];
  for (var j=0;j<vrows.length;j++){

    s += '<div class="mbar"><span class="ml">' + vr[0] + '</span>' +

  }
  s += '<div class="dim" style="font-size:12px;line-height:1.6;margin-top:6px">' +
    '宏量单位：克；维生素：mg / µg。蛋白按体重 ×1.6、脂肪 ×0.8 估算，碳水由总热量倒推。' +
    '维生素为常见食物的粗略值，仅供参考。</div></div>';

}

function vitaminCard(){
  var st = dayStats(today());
  var rows = [["维C", Math.round(st.vc), 100, "mg"], ["维A", Math.round(st.va), 800, "µg"], ["维D", Math.round(st.vd*10)/10, 10, "µg"]];
  var s = '<div class="card"><h3>维生素</h3>';
  for (var i=0;i<rows.length;i++){
    var r = rows[i], pct = r[2] ? Math.min(100, Math.round(r[1] / r[2] * 100)) : 0;
    s += '<div class="mbar"><span class="ml">' + r[0] + '</span>' +

  }

    '<div class="big">' + total + '<small>千卡摄入</small></div>' +

        '<span style="font-weight:700;color:' + (left < 0 ? "#ff453a" : "#30d158") + '">' +

      : '<div class="dim" style="margin-top:8px">填好体重后会自动估算每日目标。</div>') +

  s += '<div class="card"><div class="spread" style="margin-bottom:10px"><h3 style="margin:0">今天吃了什么</h3>' +

        '<button class="iconbtn" data-act="food:del" data-id="' + f.id + '">✕</button></span></div>';
    }
  }
  s += '<div class="dim" style="font-size:12px;margin-top:8px">数值是每「1 份」的估算，可以改成你常吃那家的实际情况。</div></div>';

/* 搜索只操作 DOM，不重绘，避免输入框失焦 */
function filterSheet(q){
  var sheet = document.getElementById("sheet");
  if (!sheet || !sheet.querySelectorAll) return;
  q = String(q || "").trim().toLowerCase();
  var rows = sheet.querySelectorAll(".pick[data-name]");
  for (var i=0;i<rows.length;i++){
    var name = String(rows[i].getAttribute("data-name") || "");
    rows[i].style.display = (!q || name.indexOf(q) >= 0) ? "" : "none";
  }
  var groups = sheet.querySelectorAll(".fgroup");
  for (var g=0;g<groups.length;g++){
    var items = groups[g].querySelectorAll(".pick"), has = false;
    for (var k=0;k<items.length;k++) if (items[k].style.display !== "none") has = true;
    groups[g].style.display = has ? "" : "none";
  }
}

/* ========== 工具 ========== */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ===== 长按确认（3 秒） ===== */
var HOLD_MS = 3000;
var hold = { el:null, raf:null, start:0 };
var raf = (typeof requestAnimationFrame === "function")
  ? function(f){ return requestAnimationFrame(f); }
  : function(f){ return setTimeout(f, 16); };
var caf = (typeof cancelAnimationFrame === "function")
  ? function(h){ cancelAnimationFrame(h); }
  : function(h){ clearTimeout(h); };

function holdStart(el){
  if (hold.el) return;
  hold.el = el; hold.start = Date.now();
  el.classList.add("holding");
  var txt = el.querySelector(".hold-txt"), fill = el.querySelector(".hold-fill");
  if (txt) txt.textContent = "继续按住…";
  function tick(){
    if (!hold.el) return;
    var p = Math.min(1, (Date.now() - hold.start) / HOLD_MS);
    if (fill) fill.style.width = (p * 100).toFixed(1) + "%";
    if (p >= 1){ holdDone(); return; }
    hold.raf = raf(tick);
  }
  hold.raf = raf(tick);
}
function holdReset(){
  if (!hold.el) return;
  if (hold.raf) caf(hold.raf);
  var el = hold.el;
  hold.el = null; hold.raf = null;
  el.classList.remove("holding");
  var fill = el.querySelector(".hold-fill");
  if (fill) fill.style.width = "0%";
  var txt = el.querySelector(".hold-txt");
  if (txt) txt.textContent = el.getAttribute("data-hold-label") || "长按结束训练";
}
function holdDone(){
  var el = hold.el;
  holdReset();

function confetti(cv){
  if (!cv || !cv.getContext) return;
  var dpr = (typeof window !== "undefined" && window.devicePixelRatio) ? Math.min(2, window.devicePixelRatio) : 1;
  var W = cv.clientWidth || 320, H = cv.clientHeight || 620;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  var ctx = cv.getContext("2d");
  if (!ctx) return;
  ctx.scale(dpr, dpr);
  var colors = ["#e33b3b","#ff6b6b","#ffb340","#ffffff","#30d158"];
  var ps = [], i;
  for (i=0;i<110;i++){
    ps.push({
      x: Math.random()*W, y: -Math.random()*H*0.7,
      w: 4 + Math.random()*5, h: 8 + Math.random()*9,
      vx: (Math.random()-.5)*1.8, vy: 2 + Math.random()*3.6,
      a: Math.random()*Math.PI, va: (Math.random()-.5)*0.28,
      c: colors[i % colors.length]
    });
  }
  var t0 = Date.now();
  function frame(){
    var t = Date.now() - t0;
    ctx.clearRect(0,0,W,H);
    for (var k=0;k<ps.length;k++){
      var p = ps[k];
      p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += 0.02;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.globalAlpha = t > 2400 ? Math.max(0, 1 - (t - 2400) / 900) : 1;
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (t < 3400) raf(frame);
    else ctx.clearRect(0,0,W,H);
  }
  raf(frame);
}

function clearAllCaches(){
  if (typeof caches === "undefined") return Promise.resolve();
  return caches.keys().then(function(ks){
    return Promise.all(ks.map(function(k){ return caches.delete(k); }));
  }).catch(function(){});

function hardReload(){
  toast("正在更新…");
  var done = false;
  function go(){ if (done) return; done = true; try { location.reload(); } catch(e){} }
  try {
    if (typeof navigator !== "undefined" && navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister().catch(function(){}); }));
      }).catch(function(){}).then(clearAllCaches).then(function(){ setTimeout(go, 400); });
      setTimeout(go, 2500);
      return;
    }
  } catch(e){}
  clearAllCaches().then(function(){ setTimeout(go, 200); });
  setTimeout(go, 1500);
}

  if (act === "onb:save"){
    var gv3 = function(id){ var el = document.getElementById(id); return el ? String(el.value) : ""; };
    var oa = Number(gv3("obAge")), oh = Number(gv3("obHeight")), ow = Number(gv3("obWeight")), ob = Number(gv3("obBF"));
    if (!(oa > 0 && oh > 0 && ow > 0)){ toast("年龄、身高、体重都要填"); return; }
    db.profile.sex = ui.obSex || "m";
    db.profile.age = Math.round(oa);
    db.profile.height = Math.round(oh * 10) / 10;
    db.profile.weight = Math.round(ow * 10) / 10;
    db.profile.bfManual = (ob > 0) ? Math.round(ob * 10) / 10 : 0;
    db.onboarded = true;
    ui.onboard = false;
    save(); render();
    toast("已保存，可在「设置」里调整");
    return;
  }

  /* 彩蛋：连点身体数据卡片 */
  if (act === "egg"){
    var tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "select" || tag === "button" || tag === "svg" || tag === "use") return;
    tapEgg();
    return;
  }

  if (act === "data:export"){
    var blob = new Blob([JSON.stringify(db, null, 2)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "燃-备份-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    toast("已导出");
    return;
  }
  if (act === "data:import"){
    var f = document.createElement("input");
    f.type = "file"; f.accept = ".json,application/json";
    f.onchange = function(){
      var file = f.files && f.files[0]; if (!file) return;
      var rd = new FileReader();
      rd.onload = function(){
        try {
          var o = JSON.parse(rd.result);
          if (!o || !o.ex) throw new Error("bad");
          if (confirm("导入会覆盖当前数据，继续？")){
            db = normalize(o); db.active = null;
            ui.open = null; ui.edit = null;
            save(); render(); toast("导入成功");
          }
        } catch(e){ toast("文件格式不对"); }
      };
      rd.readAsText(file);
    };
    f.click();
    return;
  }
  if (act === "data:clear"){
    if (confirm("清空全部数据？动作、训练记录、饮食、身体数据都会删掉，不可恢复")){
      db = defaults(); save(); render(); toast("已清空");
    }
    return;
  }
});

document.addEventListener("input", function(ev){
  if (ev.target && ev.target.id === "foodSearch"){
    ui.foodQ = ev.target.value || "";
    filterSheet(ui.foodQ);
  }
  if (ev.target && ev.target.id === "exSearch"){
    ui.exQ = ev.target.value || "";
    filterSheet(ui.exQ);
  }
});

document.addEventListener("change", function(ev){
  if (ev.target && ev.target.id === "autoEndIn"){
    var av = Number(ev.target.value);
    if (!isFinite(av) || av < 5){ ev.target.value = db.settings.autoEndMin; toast("最少 5 分钟"); return; }
    db.settings.autoEndMin = Math.round(av); save(); return;
  }
  var key = ev.target.getAttribute && ev.target.getAttribute("data-pf");
  if (key){
    var v = Number(ev.target.value);
    if (!isFinite(v) || v <= 0){ ev.target.value = db.profile[key] || ""; toast("请填写正数"); return; }
    if (key === "bmr"){
      var a = bmrAuto();
      db.profile.bmrManual = (a && Math.abs(v - a) < 1) ? 0 : Math.round(v);
    } else if (key === "bf"){
      var ba = bfAuto();
      db.profile.bfManual = (ba && Math.abs(v - ba) < 0.2) ? 0 : Math.round(v * 10) / 10;
    } else if (key === "age"){
      db.profile.age = Math.round(v);
    } else {
      db.profile[key] = Math.round(v * 10) / 10;
    }
    save(); render(); toast("已保存");
    return;
  }
  if (ev.target.id === "stepIn"){
    var sv = Number(ev.target.value);
    if (!isNaN(sv) && sv >= 0.25 && sv <= 10){ db.settings.step = Math.round(sv * 100) / 100; save(); toast("已保存"); }
    else { ev.target.value = db.settings.step; toast("请填 0.25 - 10"); }
    return;
  }
  if (ev.target.id === "restIn"){
    var v = Number(ev.target.value);
    if (!isNaN(v) && v >= 5 && v <= 600){ db.settings.rest = Math.round(v); save(); toast("已保存"); }
    else { ev.target.value = db.settings.rest; toast("请填 5 - 600"); }
  }
});

/* 点空白遮罩关闭底部面板 */
var maskEl = document.getElementById("mask");
if (maskEl){
  maskEl.addEventListener("click", function(ev){
    if (ev.target && ev.target.id === "mask"){
      if (ui.onboard){ ui.onboard = false; db.onboarded = true; save(); }
      ui.pick = false; ui.foodPick = false; ui.foodForm = false; ui.exForm = false; ui.nfDraft = {};
      paintSheet();
    }
  });
}

/* 手机上弹出键盘时，把正在输入的框滚到可见位置 */
document.addEventListener("focusin", function(ev){
  var el = ev.target;
  if (!el || (el.tagName !== "INPUT" && el.tagName !== "SELECT")) return;
  if (!el.closest || !el.closest("#sheet")) return;
  setTimeout(function(){
    try { el.scrollIntoView({ block:"center" }); } catch(e){}
  }, 320);
  setTimeout(function(){
    try { el.scrollIntoView({ block:"center" }); } catch(e){}
  }, 620);
});

/* 长按 3 秒才结束训练，防止误触 */
document.addEventListener("pointerdown", function(ev){
  var b = ev.target && ev.target.closest ? ev.target.closest("[data-hold]") : null;
  if (!b) return;
  if (ev.preventDefault) ev.preventDefault();
  holdStart(b);
});
document.addEventListener("pointerup", function(){ holdReset(); });
document.addEventListener("pointercancel", function(){ holdReset(); });
/* 只有指针真的离开按钮本身才取消，避免划过子元素时误中断 */
document.addEventListener("pointerleave", function(ev){
  if (hold.el && ev.target === hold.el) holdReset();
}, true);
document.addEventListener("contextmenu", function(ev){
  var b = ev.target && ev.target.closest ? ev.target.closest("[data-hold]") : null;
  if (b && ev.preventDefault) ev.preventDefault();
});
var celeBox = document.getElementById("celebrate");
if (celeBox) celeBox.addEventListener("click", function(ev){
  if (ev.target === celeBox) closeCelebrate();
});
var eggBoxEl = document.getElementById("egg");
if (eggBoxEl) eggBoxEl.addEventListener("click", function(){ closeEgg(); });

/* ========== 启动 ========== */
db = load();
ui.onboard = !db.onboarded;
ui.obSex = db.profile.sex || "m";
render();

/* 关掉计时条时也要保持自动开关显示 */
setInterval(function(){ if (rest.left <= 0) paintTimer(); }, 4000);

/* 注册 Service Worker（浏览器只在 https 或 localhost 下允许，局域网 http 会自动跳过） */
if (typeof navigator !== "undefined" && "serviceWorker" in navigator &&
    typeof location !== "undefined" &&
    (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", function(){
    try {
      navigator.serviceWorker.register("sw.js").then(function(reg){
        try { reg.update(); } catch(e){}       /* 每次启动都检查一次更新，避免卡在旧缓存 */
      }).catch(function(){});
    } catch(e){}
  });
}

})();
</script>
<script>
/* 启动动画：至少亮 1.7 秒，加载完再淡出 */
(function(){
  var sp = document.getElementById("splash");
  if (!sp) return;
  var t0 = Date.now(), done = false;
  function hide(){
    if (done) return; done = true;
    sp.classList.add("out");
    setTimeout(function(){ sp.classList.add("gone"); }, 520);
  }
  function schedule(){
    var wait = Math.max(0, 1700 - (Date.now() - t0));
    setTimeout(hide, wait);
  }
  if (document.readyState === "complete") schedule();
  else window.addEventListener("load", schedule, { once: true });
  setTimeout(hide, 4200);
})();
</script>
