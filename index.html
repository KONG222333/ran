<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="燃">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>燃</title>
<style>
:root{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --sep:rgba(84,84,88,.6);
  --txt:#fff; --dim:#8e8e93; --dim2:#636366;
  --acc:#c22c2c; --acc2:#9c1f1f; --ok:#30d158; --warn:#ff9f0a;
  --r:12px; --tabh:50px; --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.4;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}

#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:calc(env(safe-area-inset-top) + 4px) 16px 4px;min-height:44px;
  background:rgba(0,0,0,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.brand{display:flex;align-items:center;gap:8px}
.brand img{height:26px;width:auto;display:block}
.brand b{color:var(--acc)}
.brand span{font-size:9px;letter-spacing:2.5px;color:var(--dim);font-weight:600}

#main{padding:0 0 calc(var(--tabh) + var(--safe-b) + 28px);max-width:600px;margin:0 auto;
  min-height:100vh;min-height:100dvh}
.pt{font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-.7px;margin:14px 16px 3px}
.psub{font-size:15px;color:var(--dim);margin:0 16px 18px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 16px 16px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:600}
.dim{color:var(--dim);font-size:15px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  color:var(--dim);padding:36px 16px;font-size:15px}
.empty svg{width:38px;height:38px;fill:none;stroke:var(--dim2);stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:0 18px;border-radius:12px;background:var(--card2);font-size:17px;font-weight:600;
  color:var(--txt);transition:opacity .15s,transform .15s}
.btn:active{opacity:.55;transform:scale(.985)}
.btn.primary{background:var(--acc);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:32px;padding:0 14px;font-size:15px;border-radius:16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.danger{background:transparent;color:#ff453a}

.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:13px;
  background:rgba(194,44,44,.18);color:#ff8f8f;font-weight:600;white-space:nowrap}
.chip.kcal{background:rgba(255,159,10,.15);color:#ffb340}
.seg{min-height:36px;padding:0 18px;border-radius:10px;background:var(--card2);
  font-size:15px;color:var(--dim);font-weight:600}
.seg.on{background:var(--acc);color:#fff}
.hint{font-size:13px;color:var(--dim);padding:0 14px 10px;line-height:1.45}
.mbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mbar .ml{width:46px;font-size:15px;color:var(--dim);flex:none}
.mbar .mt{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.mbar .mt i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.mbar .mn{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;flex:none;text-align:right}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin:14px 0 10px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .3s}
.bar.over i{background:var(--warn)}
.big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-1px}
.big small{font-size:15px;color:var(--dim);font-weight:500;margin-left:6px;letter-spacing:0}
.search{width:100%;height:40px;padding:0 12px;border-radius:10px;border:none;
  background:var(--card2);color:var(--txt);font-size:17px;margin:4px 0 12px}
.search:focus{outline:none;box-shadow:0 0 0 2px rgba(194,44,44,.5)}
.search::placeholder{color:var(--dim2)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;height:34px;padding:0 14px;border-radius:17px;font-size:15px;
  background:var(--card2);color:var(--dim);font-weight:600}
.cats button.on{background:var(--acc);color:#fff}
.mbar .mt i.pf{background:var(--acc)}
.mbar .mt i.cf{background:var(--warn)}
.mbar .mt i.ff{background:#bf5af2}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:13px;color:var(--dim);margin:0 0 6px 2px}
select.search{appearance:none;-webkit-appearance:none}

/* 动作条目 */
.entry{background:var(--card2);border-radius:12px;margin:0 16px 12px;overflow:hidden}
.entry .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.entry .hd b{font-size:17px;font-weight:600}
.sets{padding:0 14px 4px}
.set{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;
  border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.set:first-child{border-top:none}
.set .idx{color:var(--dim);font-size:15px;width:52px;flex:none}
.set .val{flex:1;font-size:17px;font-weight:500}
.set .val i{font-style:normal;color:var(--dim);font-weight:400;font-size:13px;margin-left:3px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:16px;
  color:var(--dim);font-size:15px;flex:none}
.iconbtn:active{background:rgba(255,255,255,.08)}

/* 记录一组 */
.addset{display:flex;align-items:center;gap:8px;padding:10px 14px 14px;border-top:.5px solid var(--sep);flex-wrap:wrap}
.stepper{display:flex;align-items:center;background:rgba(120,120,128,.2);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:20px;color:var(--acc);font-weight:600}
.stepper button:active{background:rgba(255,255,255,.08)}
.stepper .num{min-width:64px;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.stepper .unit{font-size:10px;color:var(--dim);display:block;font-weight:500;line-height:1}
.addset .lbl{font-size:13px;color:var(--dim);width:100%;margin-bottom:2px}
.addset.cardio .stepper button{width:32px}
.addset.cardio .stepper .num{min-width:52px;font-size:16px}

/* 计时条 */
#timer{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe-b) + 10px);
  display:none;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;
  background:rgba(44,44,46,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-radius:16px;border:.5px solid var(--sep);z-index:18;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#timer.on{display:flex}
#timer .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:#ff6961;letter-spacing:.5px}
#timer .t small{font-size:11px;color:var(--dim);font-weight:500;display:block;letter-spacing:0}

/* 底部导航 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:19;display:flex;
  padding-bottom:var(--safe-b);background:rgba(28,28,30,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep)}
#tabs button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:10px;color:var(--dim);font-weight:500}
#tabs button.on{color:var(--acc)}
.ti{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* 选择动作 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#mask.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;
  background:var(--card);border-radius:20px 20px 0 0;padding:26px 16px calc(20px + var(--safe-b));
  -webkit-overflow-scrolling:touch}
#sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:36px;height:5px;border-radius:3px;background:#48484a}
.grp{font-size:13px;color:var(--dim);padding:16px 2px 6px;font-weight:500}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;
  border-top:.5px solid var(--sep);font-size:17px}
.pick:active{background:rgba(255,255,255,.06)}

/* 输入 */
input.num{width:76px;height:36px;padding:0 8px;border-radius:8px;border:none;
  background:rgba(120,120,128,.2);color:var(--txt);text-align:center;font-weight:600;
  font-variant-numeric:tabular-nums;font-size:17px}
input.num:focus{outline:none;box-shadow:0 0 0 2px rgba(194,44,44,.5)}
.switch{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);
  position:relative;transition:.2s;flex:none}
.switch.on{background:var(--acc)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.2s}
.switch.on::after{left:22px}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 18px);
  transform:translateX(-50%) translateY(10px);background:rgba(44,44,46,.96);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;pointer-events:none;
  transition:.2s;z-index:50;white-space:nowrap;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 长按确认按钮 */
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:none}
.hold .hold-fill{position:absolute;left:0;top:0;bottom:0;width:0;pointer-events:none;
  background:rgba(255,255,255,.3)}
.hold .hold-txt{position:relative;z-index:1}
.hold.holding{opacity:1;transform:none}

/* 训练完成庆祝 */
#celebrate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#celebrate.on{display:flex}
#celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;z-index:1;width:calc(100% - 52px);max-width:330px;text-align:center;
  animation:celIn .55s cubic-bezier(.2,.9,.3,1.35)}
@keyframes celIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.cel-ring{width:92px;height:92px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#e33b3b,#7d1414 70%);
  animation:pulse 1.5s ease-out .25s 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,44,44,.6)}100%{box-shadow:0 0 0 36px rgba(194,44,44,0)}}
.cel-ring svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;animation:draw .5s ease-out .35s both}
@keyframes draw{from{stroke-dasharray:40;stroke-dashoffset:40}to{stroke-dasharray:40;stroke-dashoffset:0}}
.cel-title{font-size:25px;font-weight:800;letter-spacing:1px}
.cel-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:16px 22px;margin:20px 0 4px}
.cel-stats b{display:block;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.cel-stats span{font-size:11px;color:var(--dim);letter-spacing:.5px}
.cel-quote{font-size:15px;color:#ffb0b0;margin:18px 0 26px;line-height:1.55;min-height:44px}

/* 小彩蛋 */
#egg{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#egg.on{display:flex}
.egg-card{width:calc(100% - 64px);max-width:310px;background:var(--card);border-radius:20px;
  padding:26px 22px;text-align:center;animation:celIn .45s cubic-bezier(.2,.9,.3,1.3)}
.egg-card b{display:block;font-size:16px;margin-bottom:12px;color:#ff8f8f;letter-spacing:.5px}
.egg-card p{margin:0;font-size:16px;line-height:1.6;color:#fff}
</style>
</head>

function normalize(d){
  if (!d || typeof d !== "object") d = defaults();
  if (!d.settings || typeof d.settings !== "object") d.settings = { rest:90, auto:true };
  if (typeof d.settings.rest !== "number") d.settings.rest = 90;
  if (typeof d.settings.auto !== "boolean") d.settings.auto = true;
  if (!Array.isArray(d.ex)) d.ex = [];
  if (!Array.isArray(d.workouts)) d.workouts = [];
  if (!Array.isArray(d.meals)) d.meals = [];
  if (!Array.isArray(d.foods)) d.foods = defaults().foods;
  d.ex = (d.ex || []).filter(function(x){ return x && x.name; });
  d.ex.forEach(function(x){
    if (!x.id) x.id = uid();
    if (x.type !== "assist") x.type = "free";
    if (GROUPS_ALL.indexOf(x.group) < 0) x.group = "其他";
    if (!x.kind) x.kind = (CARDIO_GROUPS.indexOf(x.group) >= 0) ? "cardio" : "strength";
    if (x.kind === "cardio" && !x.met) x.met = 7.0;
    if (x.inc === undefined){
      var inc = false;
      for (var ii=0;ii<DEF.length;ii++) if (DEF[ii][1] === x.name) inc = !!DEF[ii][4];
      x.inc = inc;
    }
  });
  /* 老版本升级：补上后来新增的动作（有氧、户外、更多器械），同名跳过 */
  if ((d.exSeed || 0) < 2){
    var haveEx = {};
    d.ex.forEach(function(x){ haveEx[x.name] = 1; });
    DEF.forEach(function(x){
      if (!haveEx[x[1]]){
        var cd = CARDIO_GROUPS.indexOf(x[0]) >= 0;
        d.ex.push({ id:uid(), name:x[1], group:x[0], type:"free",
          kind: cd ? "cardio" : "strength", met:x[3] || 0, inc: !!x[4] });
      }
    });
    d.exSeed = 2;
  }
  d.workouts = (d.workouts || []).filter(function(w){ return w && typeof w === "object"; });
  d.workouts.forEach(function(w){
    w.entries = (w.entries || []).filter(function(e){ return e && typeof e === "object"; });
    w.entries.forEach(function(e){
      e.sets = (e.sets || []).filter(function(s){ return s && typeof s === "object"; });
      e.sets.forEach(function(s){
        s.w = Number(s.w) || 0;
        s.r = Number(s.r) || 1;
      });
    });
  });
  if (d.active && (!d.active.entries || !Array.isArray(d.active.entries))) d.active = null;
  if (!d.profile || typeof d.profile !== "object") d.profile = { sex:"m", age:20, height:170, weight:65, bmrManual:0, bfManual:0, target:0 };
  if (d.profile.bmrManual === undefined) d.profile.bmrManual = 0;
  if (d.profile.bfManual === undefined) d.profile.bfManual = 0;
  if (d.profile.target === undefined) d.profile.target = 0;
  if (d.onboarded === undefined) d.onboarded = true;   /* 老用户不弹引导 */
  if (!d.foods) d.foods = defaults().foods;
  /* 老版本升级：补上新增的内置食物（同名的跳过，不覆盖你改过的值） */
  if ((d.seed || 0) < 2){
    var have = {};
    d.foods.forEach(function(x){ have[x.name] = 1; });
    DEF_FOODS.forEach(function(x){
      if (!have[x[0]]) d.foods.push({
        id:uid(), name:x[0], unit:x[1], kcal:x[2], cat:x[3], p:x[4], c:x[5], f:x[6]
      });
    });
    d.seed = 2;
  }
  /* 统一补齐分类和宏量（旧数据、导入的备份、手工建的食物都走这里） */
  d.foods.forEach(function(f){
    if (!f.cat){
      var c = "其他";
      for (var i=0;i<DEF_FOODS.length;i++) if (DEF_FOODS[i][0] === f.name) c = DEF_FOODS[i][3];
      f.cat = c;
    }
    if (f.cat === "零食饮料") f.cat = "零食";
    if (f.p === undefined){
      for (var k=0;k<DEF_FOODS.length;k++) if (DEF_FOODS[k][0] === f.name){
        f.p = DEF_FOODS[k][4]; f.c = DEF_FOODS[k][5]; f.f = DEF_FOODS[k][6]; break;
      }
      if (f.p === undefined){ f.p = 0; f.c = 0; f.f = 0; }
    }
  });
  if (!d.meals) d.meals = [];
  d.meals = d.meals.filter(function(m){ return m && typeof m === "object"; });
  d.meals.forEach(function(m){
    if (m.p === undefined){ m.p = 0; m.c = 0; m.f = 0; }
    if (typeof m.amount !== "number" || m.amount <= 0) m.amount = 1;
    if (typeof m.per !== "number") m.per = 0;
    if (!m.date) m.date = today();
  });
  return d;
}

function fmtW(n){

/* ===== 身体数据 & 热量估算 ===== */
function bodyWeight(){
  var w = Number(db.profile.weight);
  return (isFinite(w) && w > 0) ? w : 0;
}
function bmrAuto(){
  var p = db.profile, w = bodyWeight(), h = Number(p.height), a = Number(p.age);
  if (!w || !h || !a) return 0;
  return Math.round(10*w + 6.25*h - 5*a + (p.sex === "f" ? -161 : 5));
}
function bmrOf(){
  var m = Number(db.profile.bmrManual) || 0;
  return m > 0 ? m : bmrAuto();
}
/* 体脂率：Deurenberg 公式（由 BMI、年龄、性别估算），可手动覆盖 */
function bfAuto(){
  var p = db.profile, w = bodyWeight(), h = Number(p.height), a = Number(p.age);
  if (!w || !h || !a) return 0;
  var bmi = w / Math.pow(h / 100, 2);
  var v = 1.2 * bmi + 0.23 * a - 10.8 * (p.sex === "f" ? 0 : 1) - 5.4;
  return Math.round(v * 10) / 10;
}
function bfOf(){
  var m = Number(db.profile.bfManual) || 0;
  return m > 0 ? m : bfAuto();
}
/* 单个动作的耗热估算（MET 法，近似值） */
function kcalOf(e){
  var bw = bodyWeight();
  if (!bw) return 0;
  if (e && e.kind === "cardio"){
    var min = Number(e.dur) || 0;
    if (!min) return 0;
    var met = Number(e.met) || 7.0;
    var grade = Math.max(0, Math.min(30, Number(e.grade) || 0));
    if (grade > 0) met = met * (1 + grade * 0.045);   /* 坡度每 1% 约加 4.5% 能耗 */
    return Math.max(1, Math.round(met * 3.5 * bw / 200 * min));
  }
  if (!e.sets || !e.sets.length) return 0;
  var n = e.sets.length;
  var rest = Math.max(15, Number(db.settings.rest) || 90);
  var min = n * (45 + rest * 0.5) / 60;   /* 每组约 45 秒，休息按一半计入 */
  var met = (e.type === "assist") ? 4.2 : 5.0;
  if (e.type !== "assist"){
    var sum = 0;
    for (var i=0;i<n;i++) sum += Number(e.sets[i].w) || 0;
    if ((sum / n) / bw > 0.35) met = 5.8;  /* 相对体重较大的负荷 */
  }
  return Math.max(1, Math.round(met * 3.5 * bw / 200 * min));
}
function workoutKcal(w){
  var t = 0;
  if (!w || !w.entries) return 0;
  for (var i=0;i<w.entries.length;i++) t += kcalOf(w.entries[i]);
  return t;
}

/* ===== 1RM / 渐进超负荷 / 肌群容量 ===== */
function e1rm(w, r){ return (r > 0) ? w * (1 + r / 30) : 0; }   /* Epley 公式 */
function best1rm(sets){
  var m = 0;
  if (!sets) return 0;
  for (var i=0;i<sets.length;i++) m = Math.max(m, e1rm(Number(sets[i].w) || 0, Number(sets[i].r) || 0));
  return m;
}
function lastEntryOf(exId){
  for (var i=db.workouts.length-1;i>=0;i--){
    var w = db.workouts[i];
    for (var j=0;j<w.entries.length;j++) if (w.entries[j].exId === exId) return w.entries[j];
  }
  return null;
}
/* 下次建议：上次每组都做到 10 次以上就加重，否则先冲次数 */
function suggestOf(exId, step, isAssist){
  var le = lastEntryOf(exId);
  if (!le || !le.sets.length) return { w:null, r:8, txt:"第一次练，先估个重量" };
  var minR = 999, sum = 0, total = le.sets.length;
  for (var i=0;i<le.sets.length;i++){
    minR = Math.min(minR, Number(le.sets[i].r) || 0);
    sum += Number(le.sets[i].w) || 0;
  }
  var avg = sum / total, w = avg, txt;
  if (minR >= 10){
    w = avg + (isAssist ? -step : step);
    if (w < 0) w = 0;
    txt = "上次每组都到 " + minR + " 次，" + (isAssist ? "可以减小辅助" : "可以加重量");
  } else if (minR >= 6){
    txt = "上次最低 " + minR + " 次，先冲次数";
  } else {
    txt = "上次最低 " + minR + " 次，先稳住重量";
  }
  return { w: Math.round(w*100)/100, r: Math.max(6, minR), txt: txt };
}
function groupOf(e){
  if (e.group) return e.group;
  var x = exById(e.exId);
  return (x && x.group) || "其他";
}
function weekStats(){
  var now = new Date(), monday = new Date(now);
  monday.setHours(0,0,0,0);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  var map = {}, total = 0;
  for (var i=0;i<db.workouts.length;i++){
    var w = db.workouts[i];
    if (new Date(w.date + "T12:00:00") < monday) continue;
    for (var j=0;j<w.entries.length;j++){
      var g = groupOf(w.entries[j]);
      map[g] = (map[g] || 0) + w.entries[j].sets.length;
      total += w.entries[j].sets.length;
    }
  }
  return { map:map, total:total };
}

  var total = 0, i;
  if (a.entries) for (i=0;i<a.entries.length;i++){
    var en0 = a.entries[i];
    if (en0.kind === "cardio"){ if (Number(en0.dur) > 0) total++; }

var rest = { left:0, timer:null };
function startRest(sec){

  rest.timer = setInterval(function(){
    rest.left--;

  }, 1000);

}
function stopRest(){
  if (rest.timer) clearInterval(rest.timer);
  rest.timer = null; rest.left = 0; paintTimer();
}
function paintTimer(){
  var el = document.getElementById("timer"), v = document.getElementById("tval");
  if (!el) return;
  if (rest.left > 0){
    el.classList.add("on");
    var m = Math.floor(rest.left/60), s = rest.left % 60;
    v.textContent = m + ":" + (s<10?"0":"") + s;
  } else {
    el.classList.remove("on");
  }
  var b = el.querySelector('[data-act="timer:auto"]');
  if (b) b.textContent = "自动: " + (db.settings.auto ? "开" : "关");
}

/* ===== 组间提醒：震动 + 提示音 ===== */
var audioCtx = null;
function unlockAudio(){
  if (audioCtx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch(e){ audioCtx = null; }
}
function beep(){
  if (!audioCtx) return;
  try {
    if (audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
    var t0 = audioCtx.currentTime;
    for (var i=0;i<2;i++){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      var s0 = t0 + i * 0.28;
      g.gain.setValueAtTime(0.0001, s0);
      g.gain.exponentialRampToValueAtTime(0.22, s0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s0 + 0.22);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(s0); o.stop(s0 + 0.24);
    }
  } catch(e){}
}
function buzz(){
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
}
function alertRestEnd(){ buzz(); beep(); toast("休息结束，继续"); }

/* ===== 训练时屏幕常亮 ===== */
var wake = null, wakeWanted = false;
function setWake(on){
  wakeWanted = on;
  try {
    if (on){
      if (!navigator.wakeLock || wake) return;
      navigator.wakeLock.request("screen").then(function(l){
        wake = l;
        l.addEventListener("release", function(){ wake = null; });
      }).catch(function(){});
    } else if (wake){
      wake.release(); wake = null;
    }
  } catch(e){}
}

/* 切回前台时，如果还在训练就重新要求常亮 */
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible" && wakeWanted && !wake){
    wakeWanted = false;
    setWake(true);
  }
});

/* ===== 个人纪录 ===== */
function prList(){
  var map = {}, i, j;
  for (i=0;i<db.workouts.length;i++){
    var w = db.workouts[i];
    for (j=0;j<w.entries.length;j++){
      var e = w.entries[j];
      if (!e.sets || !e.sets.length) continue;
      if (e.type === "assist") continue;   /* 辅助动作的「重量」不是负荷，不参与 1RM 排名 */
      var key = e.exId || e.name;
      var e1 = best1rm(e.sets);
      var top = e.sets[0];
      for (var s=1;s<e.sets.length;s++) if (e.sets[s].w > top.w) top = e.sets[s];
      if (!map[key] || e1 > map[key].e1){
        map[key] = { name:e.name, e1:e1, w:top.w, r:top.r, date:w.date };
      }
    }
  }
  var arr = [];
  for (var k in map) if (map.hasOwnProperty(k)) arr.push(map[k]);
  arr.sort(function(a,b){ return b.e1 - a.e1; });
  return arr;
}

/* ===== 宏量营养素 ===== */
function macroTargets(){
  var w = bodyWeight(), kcal = targetKcal();
  if (!w) return null;
  var p = Math.round(w * 1.6);
  var f = Math.round(w * 0.8);
  var c = Math.max(0, Math.round((kcal - p*4 - f*9) / 4));
  return { p:p, c:c, f:f };
}
function macroSums(meals){
  var p = 0, c = 0, f = 0;
  for (var i=0;i<meals.length;i++){
    var m = meals[i];
    p += (Number(m.p) || 0) * m.amount;
    c += (Number(m.c) || 0) * m.amount;
    f += (Number(m.f) || 0) * m.amount;
  }
  return { p:Math.round(p), c:Math.round(c), f:Math.round(f) };
}

/* ========== 渲染 ========== */
function render(){
  paintTimer();
  if (wakeWanted !== !!db.active) setWake(!!db.active);
  var main = document.getElementById("main");
  var hdrR = document.getElementById("hdrRight");
  hdrR.innerHTML = "";
  var tabs = document.querySelectorAll("#tabs button");
  for (var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle("on", tabs[i].getAttribute("data-tab") === ui.tab);
  }
  if (ui.tab === "train") main.innerHTML = viewTrain();
  else if (ui.tab === "hist") main.innerHTML = viewHist();
  else if (ui.tab === "food") main.innerHTML = viewFood();
  else main.innerHTML = viewSet();

  /* 训练进行中时，任何页面顶部都能结束，不用切回训练页 */
  if (db.active){
    hdrR.innerHTML = '<button class="btn sm hold" data-hold="1" data-hold-label="结束训练" ' +
      'style="color:var(--acc)"><span class="hold-fill"></span>' +
      '<span class="hold-txt">结束训练</span></button>';
  }
  paintSheet();
  save();
}

/* ===== 页面骨架 ===== */
function pageHead(title, sub){
  return '<h1 class="pt">' + title + '</h1>' +
    (sub ? '<div class="psub">' + sub + '</div>' : '<div style="height:14px"></div>');
}
function emptyState(icon, title, sub, act, label){
  return '<div class="empty">' +
    '<svg><use href="#' + icon + '"></use></svg>' +
    '<div style="color:var(--txt);font-weight:600;font-size:17px">' + title + '</div>' +
    (sub ? '<div>' + sub + '</div>' : '') +
    (act ? '<button class="btn primary" data-act="' + act + '" style="margin-top:10px">' + label + '</button>' : '') +
    '</div>';
}
function weekSummary(){
  var now = new Date(), mon = new Date(now);
  mon.setHours(0,0,0,0);
  mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  var count = 0, vol = 0, kcal = 0;
  for (var i=0;i<db.workouts.length;i++){
    var w = db.workouts[i];
    if (new Date(w.date + "T12:00:00") < mon) continue;
    count++;
    vol += volume(w);
    kcal += workoutKcal(w);
  }
  return { count:count, volume:Math.round(vol), kcal:Math.round(kcal) };
}

function entryCard(where, ei, e){
  if (e.kind === "cardio") return cardioCard(where, ei, e);
  var unit = unitOf(e.type), lab = labelOf(e.type);
  var step = (e.type === "assist") ? 5 : 2.5;
  var ls = lastSets(e.exId);
  var le = lastEntryOf(e.exId);
  var sug = suggestOf(e.exId, step, e.type === "assist");

  var pw = 20, pr = 10;
  if (e.sets.length){ pw = e.sets[e.sets.length-1].w; pr = e.sets[e.sets.length-1].r; }
  else if (sug.w !== null){ pw = sug.w; pr = sug.r; }
  else if (ls && ls.length){ pw = ls[ls.length-1].w; pr = ls[ls.length-1].r; }

  var b1 = Math.max(best1rm(e.sets), le ? best1rm(le.sets) : 0);
  var kc = kcalOf(e);
  var s = '<div class="entry"><div class="hd"><b>' + esc(e.name) + '</b><span class="row" style="gap:6px">' +
    (e.type === "assist" ? '<span class="chip">辅助</span>' : '') +
    (kc ? '<span class="chip kcal">≈ ' + kc + ' 千卡</span>' : '') +
    (where === "active" ? '<button class="iconbtn" data-act="ex:remove" data-e="' + ei + '">✕</button>' : '') +
    '</span></div>' +
    '<div class="hint">' +
      (sug.w !== null ? '建议' + (e.type === "assist" ? "辅助 " : " ") + fmtW(sug.w) + 'kg · ' : '') +
      sug.txt + (b1 ? ' · 1RM≈' + Math.round(b1) + 'kg' : '') + '</div>' +
    '<div class="sets">';
  if (!e.sets.length){
    s += '<div class="dim" style="padding:4px 2px 8px">还没有记录，下面记第一组</div>';
  }
  for (var k=0;k<e.sets.length;k++){
    var st = e.sets[k];
    var editing = ui.edit && ui.edit.w === where && ui.edit.e === ei && ui.edit.s === k;
    if (editing){
      s += '<div class="set"><span class="idx">第' + (k+1) + '组</span>' +
        '<input class="num" data-in="w" type="number" inputmode="decimal" step="0.5" value="' + fmtW(st.w) + '">' +
        '<span class="dim">×</span>' +
        '<input class="num" data-in="r" type="number" inputmode="numeric" step="1" value="' + st.r + '">' +
        '<button class="iconbtn" data-act="set:save" data-w="' + where + '" data-e="' + ei + '" data-s="' + k + '">✓</button>' +
        '</div>';
    } else {
      s += '<div class="set"><span class="idx">第' + (k+1) + '组</span>' +
        '<span class="val">' + fmtW(st.w) + '<i>' + unit + '</i> × ' + st.r + '<i>次</i></span>' +
        '<button class="iconbtn" data-act="set:edit" data-w="' + where + '" data-e="' + ei + '" data-s="' + k + '">改</button>' +
        '<button class="iconbtn" data-act="set:del" data-w="' + where + '" data-e="' + ei + '" data-s="' + k + '">✕</button>' +
        '</div>';
    }
  }
  s += '</div>';
  if (where === "active"){
    s += '<div class="addset" data-ei="' + ei + '">' +
      '<span class="lbl">记录一组 · ' + lab + '</span>' +
      '<div class="stepper" data-step="' + (e.type === "assist" ? 5 : 2.5) + '">' +
        '<button data-act="st:down" data-k="w">−</button>' +
        '<div class="num" data-v="w">' + fmtW(pw) + '<span class="unit">' + unit + '</span></div>' +
        '<button data-act="st:up" data-k="w">+</button>' +
      '</div>' +
      '<div class="stepper" data-step="1">' +
        '<button data-act="st:down" data-k="r">−</button>' +
        '<div class="num" data-v="r">' + pr + '<span class="unit">次</span></div>' +
        '<button data-act="st:up" data-k="r">+</button>' +
      '</div>' +
      '<button class="btn sm primary" data-act="set:add" data-e="' + ei + '">记录</button>' +
      '</div>';
  }
  s += '</div>';
  return s;
}

/* 有氧动作卡片：记时长 + 距离 */
function cardioCard(where, ei, e){
  var kc = kcalOf(e);
  var last = lastEntryOf(e.exId);
  var du = e.dur || (last && last.dur) || 30;
  var km = (e.km !== undefined && e.km !== null) ? e.km : ((last && last.km) || 0);
  var gr = (e.grade !== undefined && e.grade !== null) ? e.grade : ((last && last.grade) || 0);
  var hint;
  if (e.dur){
    hint = e.dur + ' 分钟' + (e.km ? ' · ' + fmtW(e.km) + ' km' : '') +
      (gr ? ' · 坡度 ' + gr + '%' : '') + (kc ? ' · 约 ' + kc + ' 千卡' : '');
  } else if (last && last.dur){
    hint = '上次 ' + last.dur + ' 分钟' + (last.km ? ' · ' + fmtW(last.km) + ' km' : '') +
      (last.grade ? ' · 坡度 ' + last.grade + '%' : '') + ' · 填完自动算消耗';
  } else {
    hint = '填时长后自动估算消耗';
  }
  var s = '<div class="entry"><div class="hd"><b>' + esc(e.name) + '</b>' +
    '<span class="row" style="gap:6px"><span class="chip">有氧</span>' +
    (kc ? '<span class="chip kcal">≈ ' + kc + ' 千卡</span>' : '') +
    (where === "active" ? '<button class="iconbtn" data-act="ex:remove" data-e="' + ei + '">✕</button>' : '') +
    '</span></div>' +
    '<div class="hint">' + hint + '</div>';
  if (where === "active"){
    s += '<div class="addset cardio" data-ei="' + ei + '">' +
      '<span class="lbl">时长 / 距离</span>' +
      '<div class="stepper" data-step="5">' +
        '<button data-act="st:down" data-k="d">−</button>' +
        '<div class="num" data-v="d">' + du + '<span class="unit">分钟</span></div>' +
        '<button data-act="st:up" data-k="d">+</button></div>' +
      '<div class="stepper" data-step="0.5">' +
        '<button data-act="st:down" data-k="k">−</button>' +
        '<div class="num" data-v="k">' + fmtW(km) + '<span class="unit">km</span></div>' +
        '<button data-act="st:up" data-k="k">+</button></div>' +
      (e.inc ? '<div class="stepper" data-step="1">' +
        '<button data-act="st:down" data-k="g">−</button>' +
        '<div class="num" data-v="g">' + gr + '<span class="unit">坡度%</span></div>' +
        '<button data-act="st:up" data-k="g">+</button></div>' : '') +
      '<button class="btn sm primary" data-act="cardio:set" data-e="' + ei + '">' +
      (e.dur ? "更新" : "记录") + '</button>' +
      (e.dur ? '<button class="iconbtn" data-act="cardio:del" data-e="' + ei + '">✕</button>' : '') +
      '</div>';
  }
  s += '</div>';
  return s;
}

function countSets(w){
  var t = 0;
  for (var i=0;i<w.entries.length;i++) t += (w.entries[i].sets || []).length;
  return t;
}
function countCardioMin(w){
  var t = 0;
  for (var i=0;i<w.entries.length;i++){
    if (w.entries[i].kind === "cardio") t += Number(w.entries[i].dur) || 0;
  }
  return t;
}
function volume(w){
  var v = 0;
  for (var i=0;i<w.entries.length;i++){
    if (w.entries[i].type === "assist") continue;   /* 辅助重量不是负荷，不参与容量 */
    for (var k=0;k<w.entries[i].sets.length;k++) v += w.entries[i].sets[k].w * w.entries[i].sets[k].r;
  }
  return Math.round(v);
}

  }

  for (var j=0;j<ws.length;j++){
    var w = ws[j], idx = db.workouts.length - 1 - j;
    var open = ui.open === w.id;
    var wk = workoutKcal(w);
    var sumParts = [w.entries.length + ' 个动作'];
    if (countSets(w)) sumParts.push(countSets(w) + ' 组');
    if (countCardioMin(w)) sumParts.push('有氧 ' + countCardioMin(w) + ' 分钟');

  var b = bmrOf();

}

function filterSheet(q){
  var sheet = document.getElementById("sheet");

  q = String(q || "").trim().toLowerCase();
  var rows = sheet.querySelectorAll(".pick[data-name]");
  for (var i=0;i<rows.length;i++){
    var name = String(rows[i].getAttribute("data-name") || "");
    rows[i].style.display = (!q || name.indexOf(q) >= 0) ? "" : "none";
  }
  var groups = sheet.querySelectorAll(".fgroup");
  for (var g=0;g<groups.length;g++){
    var items = groups[g].querySelectorAll(".pick"), has = false;
    for (var k=0;k<items.length;k++) if (items[k].style.display !== "none") has = true;
    groups[g].style.display = has ? "" : "none";
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });

/* ===== 长按确认（3 秒） ===== */
var HOLD_MS = 3000;
var hold = { el:null, raf:null, start:0 };
var raf = (typeof requestAnimationFrame === "function")
  ? function(f){ return requestAnimationFrame(f); }
  : function(f){ return setTimeout(f, 16); };
var caf = (typeof cancelAnimationFrame === "function")
  ? function(h){ cancelAnimationFrame(h); }
  : function(h){ clearTimeout(h); };

function holdStart(el){
  if (hold.el) return;
  hold.el = el; hold.start = Date.now();
  el.classList.add("holding");
  var txt = el.querySelector(".hold-txt"), fill = el.querySelector(".hold-fill");
  if (txt) txt.textContent = "继续按住…";
  function tick(){
    if (!hold.el) return;
    var p = Math.min(1, (Date.now() - hold.start) / HOLD_MS);
    if (fill) fill.style.width = (p * 100).toFixed(1) + "%";
    if (p >= 1){ holdDone(); return; }
    hold.raf = raf(tick);
  }
  hold.raf = raf(tick);
}
function holdReset(){
  if (!hold.el) return;
  if (hold.raf) caf(hold.raf);
  var el = hold.el;
  hold.el = null; hold.raf = null;
  el.classList.remove("holding");
  var fill = el.querySelector(".hold-fill");
  if (fill) fill.style.width = "0%";
  var txt = el.querySelector(".hold-txt");
  if (txt) txt.textContent = el.getAttribute("data-hold-label") || "长按结束训练";
}
function holdDone(){
  var el = hold.el;
  holdReset();
  try { if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(40); } catch(e){}
  if (el) finishWorkout();
}

function closeCelebrate(){

function celebrate(w){
  var box = document.getElementById("celebrate"), card = document.getElementById("celCard");
  if (!box || !card) return;
  var dur = Math.max(1, Math.round(((w.end || Date.now()) - (w.start || Date.now())) / 60000));
  var stats = [[dur, "分钟", "时长"]];
  var sets = countSets(w);
  if (sets) stats.push([sets, "组", "组数"]);
  var cmin = countCardioMin(w);
  if (cmin) stats.push([cmin, "分钟", "有氧"]);
  var kc = workoutKcal(w);
  if (kc) stats.push([kc, "千卡", "消耗"]);
  var q = QUOTES[Math.floor(Math.random() * QUOTES.length)];

  card.innerHTML =
    '<div class="cel-ring"><svg><use href="#i-check"></use></svg></div>' +
    '<div class="cel-title">训练完成</div>' +
    '<div class="dim" style="font-size:14px;margin-top:4px">' + w.entries.length + ' 个动作</div>' +
    '<div class="cel-stats">' + stats.map(function(s){
      return '<div><b>' + s[0] + '</b><span>' + s[2] + ' ' + s[1] + '</span></div>';
    }).join("") + '</div>' +
    '<div class="cel-quote">' + q + '</div>' +
    '<button class="btn primary block" data-act="cel:close" style="height:46px">完成</button>';
  box.classList.add("on");
  confetti(document.getElementById("cvs"));
}
function confetti(cv){
  if (!cv || !cv.getContext) return;
  var dpr = (typeof window !== "undefined" && window.devicePixelRatio) ? Math.min(2, window.devicePixelRatio) : 1;
  var W = cv.clientWidth || 320, H = cv.clientHeight || 620;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  var ctx = cv.getContext("2d");
  if (!ctx) return;
  ctx.scale(dpr, dpr);
  var colors = ["#e33b3b","#ff6b6b","#ffb340","#ffffff","#30d158"];
  var ps = [], i;
  for (i=0;i<110;i++){
    ps.push({
      x: Math.random()*W, y: -Math.random()*H*0.7,
      w: 4 + Math.random()*5, h: 8 + Math.random()*9,
      vx: (Math.random()-.5)*1.8, vy: 2 + Math.random()*3.6,
      a: Math.random()*Math.PI, va: (Math.random()-.5)*0.28,
      c: colors[i % colors.length]
    });
  }
  var t0 = Date.now();
  function frame(){
    var t = Date.now() - t0;
    ctx.clearRect(0,0,W,H);
    for (var k=0;k<ps.length;k++){
      var p = ps[k];
      p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += 0.02;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.globalAlpha = t > 2400 ? Math.max(0, 1 - (t - 2400) / 900) : 1;
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (t < 3400) raf(frame);
    else ctx.clearRect(0,0,W,H);
  }
  raf(frame);
}

/* ========== 事件 ========== */
document.addEventListener("click", function(ev){
  unlockAudio();
  var t = ev.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");

  if (act === "tab"){
    ui.tab = t.getAttribute("data-tab"); ui.edit = null;
    var mm = document.getElementById("main");
    if (mm) mm.scrollTop = 0;
    render(); return;
  }

  if (act === "wo:start"){ startWorkout(); return; }
  if (act === "wo:copy"){ copyLastWorkout(); return; }
  if (act === "wo:finish"){ finishWorkout(); return; }
  if (act === "wo:cancel"){
    if (confirm("放弃这次训练？已记录的内容会丢掉")){ db.active = null; stopRest(); render(); }
    return;
  }

  if (act === "ex:open"){ ui.pick = true; ui.exQ = ""; paintSheet(); return; }
  if (act === "ex:close"){ ui.pick = false; paintSheet(); return; }
  if (act === "ex:add"){ addEntry(t.getAttribute("data-id")); return; }
  if (act === "ex:remove"){
    var rei = Number(t.getAttribute("data-e"));
    var ra = db.active;
    if (!ra || !ra.entries || !ra.entries[rei]) return;
    var re = ra.entries[rei];
    var hasData = (re.sets && re.sets.length > 0) || Number(re.dur) > 0;
    if (hasData && !confirm("移除「" + re.name + "」？已记录的内容会一起删掉")) return;
    ra.entries.splice(rei, 1);
    ui.edit = null;
    save(); render(); toast("已移除 " + re.name);
    return;
  }
  if (act === "ex:new"){
    ui.exForm = true; ui.exKind = "strength"; ui.exCat = "胸";
    ui.exAssist = false; ui.exMet = 7; ui.exName = ""; ui.exInc = false;
    paintSheet();
    return;
  }
  if (act === "exForm:close"){ ui.exForm = false; paintSheet(); return; }
  if (act === "exForm:kind"){
    var nameEl = document.getElementById("exName");
    ui.exName = nameEl ? String(nameEl.value) : "";
    ui.exKind = t.getAttribute("data-kind") || "strength";
    ui.exCat = (ui.exKind === "cardio") ? "有氧" : "胸";
    paintSheet();
    return;
  }
  if (act === "exForm:assist"){ ui.exAssist = !ui.exAssist; paintSheet(); return; }
  if (act === "exForm:inc"){ ui.exInc = !ui.exInc; paintSheet(); return; }
  if (act === "exForm:save"){
    var gv2 = function(id){ var el = document.getElementById(id); return el ? String(el.value) : ""; };
    var nm2 = String(gv2("exName") || "").trim();
    if (!nm2){ toast("先填名称"); return; }
    var kind2 = ui.exKind || "strength";
    var cat2 = String(gv2("exCat") || (kind2 === "cardio" ? "有氧" : "胸"));
    var met2 = Number(gv2("exMet")) || 7;
    db.ex.push({
      id:uid(), name:nm2, group:cat2,
      type: (kind2 === "strength" && ui.exAssist) ? "assist" : "free",
      kind: kind2, met: kind2 === "cardio" ? met2 : 0,
      inc: kind2 === "cardio" ? !!ui.exInc : false
    });
    ui.exForm = false;
    save(); render(); toast("已添加 " + nm2);
    return;
  }
  if (act === "ex:del"){
    var id = t.getAttribute("data-id");
    if (confirm("删除这个动作？（历史记录不受影响）")){
      db.ex = db.ex.filter(function(x){ return x.id !== id; });
      save(); render();
    }
    return;
  }

  if (act === "meal:open"){ ui.foodPick = true; ui.foodQ = ""; ui.foodCat = ""; paintSheet(); return; }
  if (act === "meal:close"){ ui.foodPick = false; paintSheet(); return; }
  if (act === "fcat"){
    ui.foodCat = t.getAttribute("data-cat") || "";
    paintSheet();
    var si = document.getElementById("foodSearch");
    if (si && si.focus) { try { si.focus(); } catch(e){} }
    filterSheet(ui.foodQ);
    return;
  }
  if (act === "meal:add"){ addMeal(t.getAttribute("data-id")); return; }
  if (act === "meal:inc" || act === "meal:dec"){
    var mid = t.getAttribute("data-id");
    for (var mi=0;mi<db.meals.length;mi++){
      if (db.meals[mi].id === mid){
        var na = db.meals[mi].amount + (act === "meal:inc" ? 0.5 : -0.5);
        db.meals[mi].amount = Math.max(0.5, Math.round(na * 10) / 10);
        break;
      }
    }
    save(); render(); return;
  }
  if (act === "meal:del"){
    var mdid = t.getAttribute("data-id");
    db.meals = db.meals.filter(function(x){ return x.id !== mdid; });
    save(); render(); return;
  }
  if (act === "food:new"){ ui.foodForm = true; ui.nfMode = "serving"; ui.nfDraft = {}; paintSheet(); return; }
  if (act === "foodForm:mode"){
    ui.nfDraft = readFoodForm();
    ui.nfMode = t.getAttribute("data-mode") || "serving";
    paintSheet();
    return;
  }
  if (act === "foodForm:close"){ ui.foodForm = false; ui.nfDraft = {}; paintSheet(); return; }
  if (act === "foodForm:save"){
    var f = readFoodForm();
    var nm = String(f.name || "").trim();
    if (!nm){ toast("先填名称"); return; }
    var rec = { id:uid(), name:nm, cat:f.cat || "其他" };
    var r1 = function(x){ return Math.round(x * 10) / 10; };
    if (ui.nfMode === "100g"){
      var gr = Number(f.grams) || 100;
      if (gr <= 0) gr = 100;
      var div = (f.eunit === "kJ") ? 4.184 : 1;
      var k100 = Number(f.kcal) / div;
      if (!isFinite(k100) || k100 <= 0){ toast("能量要填正数"); return; }
      rec.kcal = Math.round(k100 * gr / 100);
      rec.p = r1((Number(f.p) || 0) * gr / 100);
      rec.c = r1((Number(f.c) || 0) * gr / 100);
      rec.f = r1((Number(f.f) || 0) * gr / 100);
      rec.unit = String(f.unit || "").trim() ||
        (gr === 100 ? "100 g" : "1 份(" + gr + "g)");
    } else {
      var kk = Number(f.kcal);
      if (!isFinite(kk) || kk <= 0){ toast("热量要填正数"); return; }
      rec.kcal = Math.round(kk);
      rec.p = Number(f.p) || 0;
      rec.c = Number(f.c) || 0;
      rec.f = Number(f.f) || 0;
      rec.unit = String(f.unit || "").trim() || "1 份";
    }
    db.foods.push(rec);
    ui.foodForm = false; ui.nfDraft = {}; ui.nfMode = "serving";
    save(); render();
    toast("已添加 · 每份 " + rec.kcal + " 千卡");
    return;
  }
  if (act === "food:del"){
    var fid = t.getAttribute("data-id");
    if (confirm("从食物库删掉？已记录的饮食不受影响")){
      db.foods = db.foods.filter(function(x){ return x.id !== fid; });
      save(); render();
    }
    return;
  }

  if (act === "st:up" || act === "st:down"){
    var box = t.closest(".addset");
    var stp = Number(t.closest(".stepper").getAttribute("data-step")) || 1;
    var k = t.getAttribute("data-k");
    var out = box.querySelector('[data-v="' + k + '"]');
    var cur = Number(out.textContent.replace(/[^\d.]/g,"")) || 0;
    var nv = act === "st:up" ? cur + stp : cur - stp;
    if (nv < 0) nv = 0;
    if (k === "g" && nv > 30) nv = 30;
    nv = Math.round(nv*100)/100;
    out.firstChild.textContent = fmtW(nv);
    return;
  }

  if (act === "set:add"){
    var ei = Number(t.getAttribute("data-e"));
    var box2 = t.closest(".addset");
    var wv = Number(box2.querySelector('[data-v="w"]').textContent.replace(/[^\d.]/g,"")) || 0;
    var rv = Number(box2.querySelector('[data-v="r"]').textContent.replace(/[^\d.]/g,"")) || 1;
    addSet(ei, wv, rv);
    return;
  }

  if (act === "cardio:set" || act === "cardio:del"){
    var cei = Number(t.getAttribute("data-e"));
    var ca = db.active;
    if (!ca || !ca.entries[cei]) return;
    var ent = ca.entries[cei];
    if (act === "cardio:del"){
      ent.dur = 0; ent.km = 0;
      save(); render(); toast("已清除"); return;
    }
    var cbox = t.closest(".addset");
    var dmin = Number(cbox.querySelector('[data-v="d"]').textContent.replace(/[^\d.]/g,"")) || 0;
    var dkm = Number(cbox.querySelector('[data-v="k"]').textContent.replace(/[^\d.]/g,"")) || 0;
    var gEl2 = cbox.querySelector('[data-v="g"]');
    var dgr = gEl2 ? (Number(gEl2.textContent.replace(/[^\d.]/g,"")) || 0) : 0;
    if (dmin <= 0){ toast("时长要大于 0"); return; }
    ent.dur = Math.round(dmin);
    ent.km = Math.round(dkm * 10) / 10;
    ent.grade = Math.min(30, Math.round(dgr));
    save(); render();
    toast("已记录 " + ent.dur + " 分钟" + (ent.km ? " · " + fmtW(ent.km) + " km" : "") +
      (ent.grade ? " · 坡度 " + ent.grade + "%" : ""));
    return;
  }

  if (act === "set:edit"){
    ui.edit = { w: t.getAttribute("data-w"), e:Number(t.getAttribute("data-e")), s:Number(t.getAttribute("data-s")) };
    render();
    var inp = document.querySelector('.set input[data-in="w"]');

      ui.edit = null; save(); render(); toast("已修改");

  }
  if (act === "set:del"){
    delSet(t.getAttribute("data-w"), Number(t.getAttribute("data-e")), Number(t.getAttribute("data-s")));

  if (act === "set:auto"){ db.settings.auto = !db.settings.auto; save(); render(); return; }

  if (act === "pf:sex"){ db.profile.sex = t.getAttribute("data-v"); save(); render(); return; }
  if (act === "pf:bmrAuto"){ db.profile.bmrManual = 0; save(); render(); toast("已恢复自动"); return; }
  if (act === "pf:bfAuto"){ db.profile.bfManual = 0; save(); render(); toast("已恢复自动估算"); return; }

  /* 首次使用引导 / 重新填写 */
  if (act === "onb:open"){
    ui.onboard = true;
    ui.obSex = db.profile.sex || "m";
    paintSheet();
    return;
  }
  if (act === "onb:sex"){ ui.obSex = t.getAttribute("data-v"); paintSheet(); return; }
  if (act === "onb:skip"){
    db.onboarded = true; ui.onboard = false;
    save(); paintSheet(); render(); toast("之后可在「设置」里随时填");
    return;
  }
  if (act === "onb:save"){
    var gv3 = function(id){ var el = document.getElementById(id); return el ? String(el.value) : ""; };
    var oa = Number(gv3("obAge")), oh = Number(gv3("obHeight")), ow = Number(gv3("obWeight")), ob = Number(gv3("obBF"));
    if (!(oa > 0 && oh > 0 && ow > 0)){ toast("年龄、身高、体重都要填"); return; }
    db.profile.sex = ui.obSex || "m";
    db.profile.age = Math.round(oa);
    db.profile.height = Math.round(oh * 10) / 10;
    db.profile.weight = Math.round(ow * 10) / 10;
    db.profile.bfManual = (ob > 0) ? Math.round(ob * 10) / 10 : 0;
    db.onboarded = true;
    ui.onboard = false;
    save(); render();
    toast("已保存，可在「设置」里调整");
    return;
  }

  /* 彩蛋：连点身体数据卡片 */
  if (act === "egg"){
    var tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "select" || tag === "button" || tag === "svg" || tag === "use") return;
    tapEgg();
    return;
  }

  if (act === "data:export"){
    var blob = new Blob([JSON.stringify(db, null, 2)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "燃-备份-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    toast("已导出");
    return;
  }
  if (act === "data:import"){
    var f = document.createElement("input");
    f.type = "file"; f.accept = ".json,application/json";
    f.onchange = function(){
      var file = f.files && f.files[0]; if (!file) return;
      var rd = new FileReader();
      rd.onload = function(){
        try {
          var o = JSON.parse(rd.result);
          if (!o || !o.ex) throw new Error("bad");
          if (confirm("导入会覆盖当前数据，继续？")){
            db = normalize(o); db.active = null;
            ui.open = null; ui.edit = null;
            save(); render(); toast("导入成功");
          }
        } catch(e){ toast("文件格式不对"); }
      };
      rd.readAsText(file);
    };
    f.click();
    return;
  }
  if (act === "data:clear"){
    if (confirm("清空全部数据？动作、训练记录、饮食、身体数据都会删掉，不可恢复")){
      db = defaults(); save(); render(); toast("已清空");
    }
    return;
  }
});

document.addEventListener("input", function(ev){
  if (ev.target && ev.target.id === "foodSearch"){
    ui.foodQ = ev.target.value || "";
    filterSheet(ui.foodQ);
  }
  if (ev.target && ev.target.id === "exSearch"){
    ui.exQ = ev.target.value || "";
    filterSheet(ui.exQ);
  }
});

document.addEventListener("change", function(ev){
  var key = ev.target.getAttribute && ev.target.getAttribute("data-pf");
  if (key){
    var v = Number(ev.target.value);
    if (!isFinite(v) || v <= 0){ ev.target.value = db.profile[key] || ""; toast("请填写正数"); return; }
    if (key === "bmr"){
      var a = bmrAuto();
      db.profile.bmrManual = (a && Math.abs(v - a) < 1) ? 0 : Math.round(v);
    } else if (key === "bf"){
      var ba = bfAuto();
      db.profile.bfManual = (ba && Math.abs(v - ba) < 0.2) ? 0 : Math.round(v * 10) / 10;
    } else if (key === "age"){
      db.profile.age = Math.round(v);
    } else {
      db.profile[key] = Math.round(v * 10) / 10;
    }
    save(); render(); toast("已保存");
    return;
  }
  if (ev.target.id === "restIn"){
    var v = Number(ev.target.value);
    if (!isNaN(v) && v >= 5 && v <= 600){ db.settings.rest = Math.round(v); save(); toast("已保存"); }
    else { ev.target.value = db.settings.rest; toast("请填 5 - 600"); }
  }
});

/* 点空白遮罩关闭底部面板 */
var maskEl = document.getElementById("mask");
if (maskEl){
  maskEl.addEventListener("click", function(ev){
    if (ev.target && ev.target.id === "mask"){
      if (ui.onboard){ ui.onboard = false; db.onboarded = true; save(); }
      ui.pick = false; ui.foodPick = false; ui.foodForm = false; ui.exForm = false; ui.nfDraft = {};
      paintSheet();
    }
  });
}

/* 手机上弹出键盘时，把正在输入的框滚到可见位置 */
document.addEventListener("focusin", function(ev){
  var el = ev.target;
  if (!el || (el.tagName !== "INPUT" && el.tagName !== "SELECT")) return;
  if (!el.closest || !el.closest("#sheet")) return;
  setTimeout(function(){
    try { el.scrollIntoView({ block:"center", behavior:"smooth" }); } catch(e){}
  }, 260);
});

/* 长按 3 秒才结束训练，防止误触 */
document.addEventListener("pointerdown", function(ev){
  var b = ev.target && ev.target.closest ? ev.target.closest("[data-hold]") : null;
  if (!b) return;
  if (ev.preventDefault) ev.preventDefault();
  holdStart(b);
});
document.addEventListener("pointerup", function(){ holdReset(); });
document.addEventListener("pointercancel", function(){ holdReset(); });
/* 只有指针真的离开按钮本身才取消，避免划过子元素时误中断 */
document.addEventListener("pointerleave", function(ev){
  if (hold.el && ev.target === hold.el) holdReset();
}, true);
document.addEventListener("contextmenu", function(ev){
  var b = ev.target && ev.target.closest ? ev.target.closest("[data-hold]") : null;
  if (b && ev.preventDefault) ev.preventDefault();
});
var celeBox = document.getElementById("celebrate");
if (celeBox) celeBox.addEventListener("click", function(ev){
  if (ev.target === celeBox) closeCelebrate();
});
var eggBoxEl = document.getElementById("egg");
if (eggBoxEl) eggBoxEl.addEventListener("click", function(){ closeEgg(); });

/* ========== 启动 ========== */
db = load();
ui.onboard = !db.onboarded;
ui.obSex = db.profile.sex || "m";
render();

/* 关掉计时条时也要保持自动开关显示 */
setInterval(function(){ if (rest.left <= 0) paintTimer(); }, 4000);

/* 注册 Service Worker（浏览器只在 https 或 localhost 下允许，局域网 http 会自动跳过） */
if (typeof navigator !== "undefined" && "serviceWorker" in navigator &&
    typeof location !== "undefined" &&
    (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", function(){
    try {
      navigator.serviceWorker.register("sw.js").then(function(reg){
        try { reg.update(); } catch(e){}       /* 每次启动都检查一次更新，避免卡在旧缓存 */
      }).catch(function(){});
    } catch(e){}
  });
}

})();
</script>
</body>
</html>
